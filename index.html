<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highlander Friends</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#14201a;--mu:#5d6b63;--ac:#1b8a4b;--on:#fff;--bd:#dfe5e0;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0f1512;--card:#18211c;--tx:#e8f0ea;--mu:#93a39a;--ac:#3dd17a;--on:#07210f;--bd:#2a362f;--bad:#ff7a6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#18211c;--tx:#e8f0ea;--mu:#93a39a;--ac:#3dd17a;--on:#07210f;--bd:#2a362f;--bad:#ff7a6b}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;max-width:560px;padding:12px}
h1{font-size:22px;margin:8px 0}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.mu{color:var(--mu);font-size:14px}
textarea{min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips button{width:auto;flex:1 1 40%;margin:0}
.pin{-webkit-text-security:disc;text-security:disc}
button,input,textarea{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:11px;width:100%;margin:4px 0}
button{cursor:pointer;text-align:center}
button:disabled{opacity:.5;cursor:default}
.sel{background:var(--ac);color:var(--on);border-color:var(--ac)}
.link{background:none;border:0;color:var(--mu);font-size:14px;text-decoration:underline;padding:8px}
.nb{background:rgba(27,138,75,.10);border:1px solid var(--ac);border-radius:10px;padding:9px 11px;margin:10px 0;font-size:14px;line-height:1.45}
.nb.w{background:rgba(192,57,43,.10);border-color:var(--bad)}
.fgt{display:block;width:100%;margin:10px 0 2px;background:none;border:2px solid var(--ac);color:var(--ac);border-radius:10px;padding:11px;font-size:15px;font-weight:700}
.gx .card{padding:10px 12px;margin:8px 0}
.gx .chips{margin:4px 0}
.gh{margin:4px 2px;font-size:15px}
.gc b{display:block}.gc .mu{display:block;margin:2px 0 6px;font-size:13px}.gc p.mu{margin:4px 0 0}.gc button{margin:2px 0}
.gr{display:flex;gap:8px}.gr input{flex:1 1 auto;min-width:0;margin:0}.gr button{width:auto;flex:none;padding:11px 18px;margin:0}
.gl{display:flex;justify-content:space-between;gap:4px}.gl button{width:auto;margin:0}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.teams button{margin:0}
.teams button.lock{opacity:.55}.teams button.used{text-decoration:line-through;opacity:.5}
.step{font-weight:700;margin:16px 0 6px}
.tw{display:grid;grid-template-columns:minmax(0,1fr) 98px;gap:8px;align-items:start}
.side{position:sticky;top:8px;border:1px solid var(--bd);border-radius:10px;padding:6px 7px;font-size:12px;line-height:1.3;background:var(--bg)}
.side b{display:block;margin-bottom:4px;font-size:12px}
.side div{padding:3px 0;border-top:1px solid var(--bd);overflow-wrap:anywhere;text-decoration:none}
.side .sp{color:var(--ac);font-weight:700}
.teams button.pend{outline:2px dashed var(--ac);outline-offset:-2px}
.sendbar{position:sticky;bottom:0;background:var(--card);padding:8px 0 env(safe-area-inset-bottom,0px);margin-top:10px}
.sendbar p{margin:4px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.inl{width:auto;display:inline-block;padding:2px 8px;margin:0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
#thm{width:44px;height:44px;padding:0;margin:0;border-radius:50%;font-size:22px;line-height:1;flex:none}
.cd{text-align:center;border-radius:12px;padding:10px;margin:8px 0;border:1px solid var(--bd);background:var(--bg)}
.cd b{font-size:26px;display:block;font-variant-numeric:tabular-nums}.cd span{font-size:13px;color:var(--mu)}
.cd.last,.cd.closed{border-color:var(--bad);color:var(--bad)}
.ok{border-color:var(--ac)}.no{border:2px solid var(--bad);text-align:center}
.mg.p{border-color:var(--bd)}
.mg{border:1px solid var(--ac);border-radius:10px;padding:8px;margin:6px 0}
summary{cursor:pointer;padding:4px 0}details.card[open] summary{margin-bottom:8px}

/* prima pagina: caratteri più grandi (registrazione e codice) */
.big h2{font-size:22px;margin-bottom:10px}.big .mu{font-size:16px}.big .nb{font-size:16px;padding:11px 13px}
.big input,.big button{font-size:19px;padding:15px 12px}.big .link{font-size:17px}.big .fgt{font-size:18px;padding:14px}
.gx .card{padding:14px}.gx .gc b{font-size:18px}.gx .gc .mu{font-size:15px}.gx .gh{font-size:18px}
.gx input,.gx button{font-size:19px;padding:15px 12px}.gx .gr button{padding:15px 22px}.gx .link{font-size:16px}
#jcd{font-size:22px;letter-spacing:1px}
/* pagina puntate: caratteri e icone più grandi */
.bx h2{font-size:21px}.bx .mu{font-size:15px}.bx .nb{font-size:16px}.bx .gh{font-size:18px}
.bx button,.bx input,.bx textarea{font-size:18px}.bx button{padding:14px 11px}.bx .link{font-size:16px}
.bx .teams{gap:10px}.bx .teams button{font-size:18px}
.bx .tw{grid-template-columns:minmax(0,1fr) 124px}.bx .side{font-size:14px;padding:8px}.bx .side b{font-size:15px}
.bx .step{font-size:19px}.bx .cd{font-size:16px}.bx .cd b{font-size:32px}.bx .cd span{font-size:15px}
.bx .row{font-size:17px;padding:9px 0}.bx .inl{font-size:17px;padding:6px 12px}
.bx summary b{font-size:18px}.bx .mg{font-size:16px}.bx .chips button{font-size:17px}
/* elenco usate sopra le squadre, a tutta larghezza: non copre più i pulsanti */
.bx .tw{display:flex;flex-direction:column;gap:10px}.bx .side{order:-1;position:static;font-size:14px;padding:8px 10px}
.bx .side b{display:block;margin-bottom:2px}.bx .side div{display:inline-block;border:1px solid var(--bd);border-radius:8px;padding:3px 9px;margin:4px 5px 0 0;background:var(--card)}
.bx .side .sp{border-color:var(--ac)}.bx .teams button{min-width:0;overflow-wrap:anywhere;font-size:18px}
/* firma */
.sig{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 14px;color:var(--mu);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.sig::before,.sig::after{content:"";height:1px;width:34px;background:var(--bd)}
.sig b{font:italic 700 20px/1 Georgia,'Times New Roman',serif;letter-spacing:.02em;text-transform:none;color:var(--on);background:linear-gradient(135deg,var(--ac),#0e5c30);padding:7px 11px 8px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.18)}
/* guida passo-passo */
#hl{display:none}#hl.on{display:block}
.hl-spot{position:fixed;z-index:150;pointer-events:none;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);transition:left .25s,top .25s,width .25s,height .25s}
.hl-spot::before,.hl-spot::after{content:"";position:absolute;inset:-4px;border:3px solid var(--ac);border-radius:16px;animation:hlp 1.5s ease-out infinite}
.hl-spot::after{animation-delay:.75s}
@keyframes hlp{0%{transform:scale(1);opacity:.95}100%{transform:scale(1.22);opacity:0}}
.hl-tip{position:fixed;left:10px;right:10px;max-width:480px;margin:0 auto;z-index:160;background:var(--card);color:var(--tx);border:2px solid var(--ac);border-radius:14px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.hl-tip .hl-n{font-size:12px;color:var(--mu);margin-bottom:4px}
.hl-tip .hl-t{font-size:16px;line-height:1.4}
.hl-tip .hl-b{display:flex;gap:8px;margin-top:10px}
.hl-tip .hl-b button{flex:1;margin:0;padding:10px 6px}
.hlnew{animation:hln 1.6s ease-out infinite;border-radius:12px}
@keyframes hln{0%{box-shadow:0 0 0 0 var(--ac)}100%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){.hl-spot::before,.hl-spot::after,.hlnew{animation:none}.hl-spot::after{display:none}}
/* ===== restyle giocatore: icone, pulsanti, stemmi ===== */
:root{--hf:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif-condensed,system-ui,sans-serif;--ac2:#126a38;--tile:#e2f4e8;--tile-hi:#f1fbf4;--tile-bd:#b5dcc3;--tile-edge:#8fc7a5;--tile-sel:#c4ebd2;--sel-hi:#7fdfa6;--sel-lo:#2fb865;--sel-tx:#06210f;--tile-lo:#c3e4d0;--ts:rgba(255,255,255,.6);--bv-hi:rgba(255,255,255,.95);--bv-lo:rgba(0,70,35,.22);--soft:rgba(27,138,75,.10);--ring:rgba(27,138,75,.24);--cs:rgba(0,0,0,.22);--gold:#c99a0c;--gold-s:rgba(201,154,12,.14);--warn:#9a5b00}
:root[data-theme="dark"]{--ac2:#23a05a;--tile:#1d3a2a;--tile-hi:#2a4f39;--tile-bd:#3c7556;--tile-edge:#050d08;--tile-sel:#285a3d;--sel-hi:#3fb673;--sel-lo:#1f8a4d;--sel-tx:#fff;--tile-lo:#142c20;--ts:rgba(0,0,0,.65);--bv-hi:rgba(255,255,255,.20);--bv-lo:rgba(0,0,0,.45);--soft:rgba(61,209,122,.12);--ring:rgba(61,209,122,.30);--cs:rgba(255,255,255,.40);--gold:#f2c230;--gold-s:rgba(242,194,48,.14);--warn:#f2c230}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac2:#23a05a;--tile:#1d3a2a;--tile-hi:#2a4f39;--tile-bd:#3c7556;--tile-edge:#050d08;--tile-sel:#285a3d;--sel-hi:#3fb673;--sel-lo:#1f8a4d;--sel-tx:#fff;--tile-lo:#142c20;--ts:rgba(0,0,0,.65);--bv-hi:rgba(255,255,255,.20);--bv-lo:rgba(0,0,0,.45);--soft:rgba(61,209,122,.12);--ring:rgba(61,209,122,.30);--cs:rgba(255,255,255,.40);--gold:#f2c230;--gold-s:rgba(242,194,48,.14);--warn:#f2c230}}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
h1{font:700 31px/1 var(--hf);letter-spacing:.2px;margin:0}
h2{font:700 24px/1.1 var(--hf);letter-spacing:.2px;margin:0 0 10px}
.big h2{font-size:27px}.bx h2{font-size:26px}
.hd{padding:2px 0 8px}
#thm{display:grid;place-items:center;color:#4a3300;background:linear-gradient(180deg,#ffe27a,#f5b800);border-color:#d99a00;box-shadow:0 3px 0 #b87f00,0 8px 12px -6px rgba(184,127,0,.6)}
#thm:hover{border-color:#b87f00}#thm:active{transform:translateY(3px);box-shadow:0 0 0 #b87f00}
#thm svg{width:22px;height:22px}
/* pulsanti */
button,input,textarea{border-width:1.5px;border-radius:14px}
button{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;background:var(--bg);box-shadow:0 2px 0 var(--bd);transition:transform .08s,box-shadow .08s,background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
button:hover{border-color:var(--mu)}
button:active{transform:translateY(2px);box-shadow:0 0 0 var(--bd)}
button:disabled{opacity:.5;box-shadow:none;transform:none;border-color:var(--bd)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.sel{color:var(--on);border-color:var(--ac);background:var(--ac);box-shadow:0 3px 0 var(--ac2)}
.sel:hover{border-color:var(--ac)}
.sel:active{box-shadow:0 0 0 var(--ac2);transform:translateY(3px)}
.sel:disabled{opacity:1;background:var(--bd);border-color:var(--bd);color:var(--mu);box-shadow:none}
.link{background:transparent;border:0;box-shadow:none;color:var(--mu);text-decoration:none;font-weight:500;border-radius:12px;padding:10px}
.link:hover{background:var(--soft);color:var(--tx)}.link:active{transform:none;box-shadow:none;background:var(--soft)}
.fgt{display:flex;background:var(--soft);box-shadow:none;border-width:1.5px}
.guide{display:inline-flex;width:auto;margin:0;padding:8px 16px 8px 13px;border-radius:999px;background:var(--soft);border:1.5px solid var(--ring);color:var(--ac);font-size:15px;box-shadow:none}
.guide .ic{width:19px;height:19px}
.hlnew{border-radius:999px}
.bx .inl,.inl{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;margin:0;border-radius:50%;box-shadow:none;font-size:16px}
.inl .ic{width:18px;height:18px}
/* campi */
input,textarea{background:var(--bg);box-shadow:inset 0 1px 2px rgba(20,32,26,.06);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--ring)}
.fld{position:relative;margin:8px 0}
.fld input{margin:0;padding-left:48px}
.fld>.ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:21px;height:21px;color:var(--mu);pointer-events:none}
.fld:focus-within>.ic{color:var(--ac)}
/* schede e titoli con icona */
.card{border-radius:18px}
.hi{display:flex;align-items:center;gap:10px}
.hi i{font-size:20px;line-height:1;width:36px;height:36px;border-radius:12px;background:var(--soft);color:var(--ac);display:grid;place-items:center;flex:none;font-style:normal}
.hi i .ic{width:21px;height:21px}
.hi.w i{background:rgba(192,57,43,.12);color:var(--bad)}
.gx .gc b,.gc b{font-family:var(--hf);font-size:22px;font-weight:700;line-height:1.15}
.gh{display:flex;align-items:center;gap:8px}.gh .ic{color:var(--ac)}
.nb .ic{vertical-align:-.2em;margin-right:2px}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
summary::-webkit-details-marker{display:none}
summary b{flex:1;min-width:0}
summary::after{content:"";width:9px;height:9px;border:solid var(--mu);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translateY(-2px);transition:transform .2s;flex:none;margin-right:4px}
details[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
summary b,.bx summary b{font:700 22px/1.1 var(--hf)}
/* percorso a tappe */
.stp{list-style:none;margin:14px 0 10px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;text-align:center;font-size:13px;line-height:1.2}
.stp li{position:relative;color:var(--mu);font-weight:600;padding:0 2px}
.stp li+li::before{content:"";position:absolute;top:15px;right:50%;width:100%;height:3px;background:var(--bd)}
.stp li.dn+li::before{background:var(--ac)}
.stp i{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;margin:0 auto 6px;border-radius:50%;background:var(--card);border:2px solid var(--bd);font:700 17px/1 var(--hf);font-style:normal}
.stp i .ic{width:17px;height:17px;stroke-width:3.2}
.stp .dn{color:var(--tx)}.stp .dn i{background:var(--ac);border-color:var(--ac);color:var(--on)}
.stp .on{color:var(--tx);font-weight:700}.stp .on i{border-color:var(--ac);color:var(--ac);box-shadow:0 0 0 4px var(--ring)}
.stp span{display:block}
.gx .stp{font-size:14px}
/* squadre: tessere con stemma */
.teams,.bx .teams{gap:10px}
.teams button,.bx .teams button{justify-content:flex-start;gap:8px;text-align:left;padding:10px;margin:0;min-height:60px;font-weight:600}
.crest{width:34px;height:40px;flex:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.38))}
.crest text{font:700 12.5px var(--hf);letter-spacing:.3px}
.crest .o{fill:none;stroke:var(--cs);stroke-width:1.5}
.tn{text-shadow:0 1px 0 var(--ts);min-width:0;overflow-wrap:break-word;font:700 21px/1.05 var(--hf)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.teams button em{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;color:var(--mu);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.teams button em .ic{width:17px;height:17px}
.teams,.bx .teams{gap:16px 12px}
.teams button,.bx .teams button{border-radius:16px;border:1.5px solid var(--tile-bd);color:var(--tx);background:linear-gradient(180deg,var(--tile-hi) 0%,var(--tile) 52%,var(--tile-lo) 100%);box-shadow:inset 0 2px 0 var(--bv-hi),inset 0 -4px 6px var(--bv-lo),0 5px 0 var(--tile-edge),0 7px 0 rgba(0,0,0,.14),0 14px 14px -6px rgba(0,0,0,.34)}
.teams button:hover{border-color:var(--ac)}
.teams button:active,.bx .teams button:active{transform:translateY(5px);box-shadow:inset 0 2px 0 var(--bv-hi),inset 0 -3px 5px var(--bv-lo),0 0 0 var(--tile-edge),0 2px 4px rgba(0,0,0,.25)}
.teams button.sel,.bx .teams button.sel{color:var(--sel-tx);background:linear-gradient(180deg,var(--sel-hi) 0%,var(--sel-lo) 100%);border-color:var(--ac2);box-shadow:inset 0 2px 0 var(--bv-hi),inset 0 -4px 6px var(--bv-lo),0 5px 0 var(--ac2),0 7px 0 rgba(0,0,0,.14),0 0 0 3px var(--ring),0 14px 14px -6px rgba(0,0,0,.34)}
.teams button.sel .ck{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--ac2);justify-content:center;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.teams button.sel .ck .ic{width:16px;height:16px;stroke-width:3.4}
.teams button.used,.bx .teams button.used{opacity:.55;background:var(--bg);border-color:var(--bd);box-shadow:none;transform:none}.teams button.used .crest{filter:grayscale(1)}.teams button.used .tn{text-decoration:line-through}
.teams button.pend{outline:2px dashed var(--ac);outline-offset:-4px}
.bx .side b{display:flex;align-items:center;gap:6px;font:700 19px/1.1 var(--hf)}
.bx .side div{display:inline-flex;align-items:center;gap:4px}
.side .ic{width:.95em;height:.95em}
.sendbar{box-shadow:0 -14px 12px -12px rgba(20,32,26,.16)}
/* titoli dei passi */
.step{display:flex;align-items:center;gap:10px;font:700 22px/1.1 var(--hf);margin:16px 0 8px}
.bx .step{font-size:23px}
.step .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ac);color:var(--on);font:700 16px/1 var(--hf);font-style:normal}
.step.me,.bx .step.me{display:inline-flex;margin:4px 0 0;padding:6px 15px 6px 11px;border-radius:999px;background:var(--soft);font-size:21px}
.step.me .ic{color:var(--ac)}
.rn{display:flex;align-items:center;gap:8px;font:700 22px/1.1 var(--hf);margin:2px 0 6px}.rn .ic{color:var(--ac)}
/* conto alla rovescia e stati */
.cd{border-radius:16px;background:var(--card)}
.cd b,.bx .cd b{font:700 40px/1.1 var(--hf)}
.cd .ic{width:1.05em;height:1.05em}
.cd.last{color:var(--warn);border-color:var(--gold);background:var(--gold-s)}
.cd.closed{background:rgba(192,57,43,.08)}
.cd.sent{border-color:var(--ac);background:var(--soft);color:var(--tx)}
.cd.sent>.ic{color:var(--ac)}
.cd.sent b,.bx .cd.sent b{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0}
.no{background:rgba(192,57,43,.06)}
.bigic{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 6px;border-radius:50%}
.bigic .ic{width:36px;height:36px}
.bigic.bad{background:rgba(192,57,43,.12);color:var(--bad)}.bigic.gold{background:var(--gold-s);color:var(--gold)}
/* messaggi */
.mg,.mg.p{border:1px solid var(--ring);border-radius:16px;background:var(--soft);padding:10px 12px;margin:8px 0}
.mg.p{border-color:var(--bd);background:var(--bg)}
@media (prefers-reduced-motion:reduce){button,input,textarea,summary::after{transition:none}}
</style>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1e8e4e">

<body>
<div class="hd"><h1>⚽ Highlander Friends</h1><button id="thm" type="button" aria-label="Cambia tema"></button></div>

let jcdDraft='',regShow=true,regMode='new',regDraft='',regPin='',regEmail='',wantMsg='',regMsg='',jmsg='',okmsg='',fbmsg='',sending=false,binding=false,bindMsg='',bindCode=null,regSt='',draft={team:''};
const save=()=>{if(G)lset('uipj',JSON.stringify(G))};
function norm(){
 if(!G||!Array.isArray(G.games)||!G.games.length){G=null;S=null;return}
 G.cur=Math.min(Math.max(0,G.cur|0),G.games.length-1);
 if(G.games.length>1){G.games=[G.games[G.cur]];G.cur=0}
 G.fb=typeof G.fb==='string'?G.fb:'';G.rules=typeof G.rules==='string'?G.rules:'';
 S=G.games[0];S.name=S.name||'Partita';S.cfg=Object.assign({deadline:'',teams:null},S.cfg||{})}
try{const q=lget('uipj');if(q)G=JSON.parse(q)}catch(e){}
norm();
const fbBase=()=>G?String(G.fb||'').trim().replace(/\/+$/,''):'';
const ready=()=>!!(S&&S.id&&fbBase());
const teams=()=>S&&S.cfg.teams&&S.cfg.teams.length>1?S.cfg.teams:DEF;
const canon=t=>teams().find(x=>x.toLowerCase()===String(t).trim().toLowerCase());

/* identità del giocatore (nome + PIN), uguale su ogni dispositivo */
/* Profili: su ogni dispositivo si possono avere più nomi (es. giocatore1, giocatore2…), ognuno con il proprio PIN */
const IDK='uipid',IDS='uipids';let idsMem=null;
function idsGet(){let o=null;try{o=JSON.parse(lget(IDS))}catch(e){}if(!o||!Array.isArray(o.list))o=idsMem&&Array.isArray(idsMem.list)?idsMem:{cur:'',list:[]};return o}
function idsPut(o){idsMem=o;lset(IDS,JSON.stringify(o))}
function idGet(){const o=idsGet(),r=o.list.find(x=>x&&x.rid===o.cur)||o.list.find(x=>x&&x.n&&x.rid);return r&&r.n&&r.rid?r:null}
function idPut(r){const o=idsGet(),i=o.list.findIndex(x=>x.rid===r.rid);if(i>=0)o.list[i]=r;else o.list.push(r);o.cur=r.rid;idsPut(o)}
function idMark(f,rid){const o=idsGet(),i=o.list.findIndex(x=>x.rid===(rid||(idGet()||{}).rid));if(i<0)return;f(o.list[i]);idsPut(o)}
function rmProfile(rid){const o=idsGet();o.list=o.list.filter(x=>x.rid!==rid);o.cur=o.list[0]?o.list[0].rid:'';idsPut(o)}
/* migrazione dalle versioni precedenti (un solo profilo) */
(function(){if(idsGet().list.length)return;
 try{const r=JSON.parse(lget(IDK));if(r&&r.n&&r.rid){idPut(r);localStorage.removeItem(IDK);return}}catch(e){}
 try{const o=JSON.parse(lget('uipreg'))||{},k=Object.keys(o).find(x=>o[x]&&o[x].n&&o[x].rid);if(!k)return;const s={};Object.keys(o).forEach(x=>{if(o[x]&&o[x].rid===o[k].rid&&o[x].sent)s[x]=1});idPut({n:o[k].n,rid:o[k].rid,s,gn:{}});localStorage.removeItem('uipreg')}catch(e){}})();
const regRec=()=>{const r=idGet();if(!r)return null;const g=S&&S.id&&r.gn&&r.gn[S.id];return Object.assign({},r,{n:g||r.n})};
const me=()=>{const r=regRec();return r?r.n:''};
const isBound=()=>{const r=idGet();return !!(r&&S&&S.id&&r.s&&r.s[S.id])};
/* Si entra in partita solo col codice: il profilo deve averlo inserito (cj), essere già giocatore (s), o averlo appena inserito in questa pagina */
let viaCode='',joinTok='';  /* viaCode: codice/link aperto prima di avere un profilo */
const codeOk=()=>{const r=idGet();if(!(r&&S&&S.id&&r.cj&&r.cj[S.id]))return false;if(stD&&stFor===S.id&&stD.jh&&String(r.cj[S.id])!==String(stD.jh))return false;return true};
const codeStale=()=>{const r=idGet();return !!(r&&S&&S.id&&r.cj&&r.cj[S.id]&&!codeOk())};

/* chiave segreta per partita (derivata dal PIN, quindi identica su ogni dispositivo) */
const rnd=()=>{const a=new Uint8Array(16);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<16;i++)a[i]=Math.random()*256}return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')};
const gameK=async kg=>(await sha('hl|g|'+S.id+'|'+kg)).slice(0,32);
const derK=async(n,pin)=>(await sha('hl|'+S.id+'|'+pidOf(n)+'|'+pin)).slice(0,32);
function setPkey(nm,k){const o=ljson('uipk',{});o[S.id+'|'+pidOf(nm)]=k;lset('uipk',JSON.stringify(o))}
function pkey(nm){const o=ljson('uipk',{}),id=S.id+'|'+pidOf(nm);if(!o[id]){const a=new Uint8Array(16);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<16;i++)a[i]=Math.random()*256}o[id]=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');lset('uipk',JSON.stringify(o))}return o[id]}

/* squadre già usate (memorizzate sul dispositivo) */
const uall=()=>ljson('uipused',{});
const usave=o=>lset('uipused',JSON.stringify(o));
const ukey=()=>S.name.toLowerCase()+'|'+me().toLowerCase();
const normT=t=>String(t).trim().toLowerCase();
/* squadre usate confermate dall'admin (fanno fede): arrivano nello stato partita */
const srvUsed=()=>{try{const u=stD&&S&&stFor===S.id&&stD.u&&stD.u[pidOf(me())];return Array.isArray(u)?u.slice():(u&&typeof u==='object'?Object.values(u):[])}catch(e){return[]}};
function allUsed(u){const seen=new Set(),out=[];srvUsed().concat(u.used).forEach(t=>{const k=normT(t);if(!seen.has(k)){seen.add(k);const c=teams().find(x=>normT(x)===k);out.push(c||String(t).trim())}});return out}
function urec(){const o=uall(),k=ukey(),r=o[k]||{used:[],pend:null};
 /* l'admin fa fede: se ha già registrato le squadre dei turni chiusi, quelle in più salvate sul telefono (puntate cambiate) vengono tolte */
 if(r.used.length&&stD&&stFor===S.id&&!isOut()){const cr=(stD.rn>0?stD.rc-1:stD.rc)|0;if(cr>=1&&srvUsed().length>=cr){r.used=[];o[k]=r;usave(o)}}
 if(r.pend){const cd=dlMs(),d=cd!==null?cd:(r.pend.dl?parseDl(r.pend.dl):NaN),cl=ready()&&rsFor===S.id&&rsClosed,pn=r.pend.rn|0,
  nx=!!(pn&&stD&&stFor===S.id&&(stD.rn>pn||(stD.rn===0&&stD.rc>=pn)));
  if((!isNaN(d)&&d<=Date.now())||cl||nx||srvUsed().some(x=>normT(x)===normT(r.pend.t))){if(!r.used.includes(r.pend.t))r.used.push(r.pend.t);r.pend=null;o[k]=r;usave(o)}}
 return r}
function recordSend(t){const rn0=stD&&stFor===S.id?(stD.rn|0):0;{const o0=uall(),k0=ukey(),r0=o0[k0];if(r0&&r0.pend&&rn0>0&&(r0.pend.rn|0)===rn0){r0.pend=null;usave(o0)}}
 const o=uall(),k=ukey(),r=urec();r.pend={t,dl:S.cfg.deadline||'',ts:Date.now(),rn:stD&&stFor===S.id?(stD.rn|0):0};o[k]=r;usave(o)}

/* avvisi dell'admin nascosti dal giocatore */
const hidAll=()=>ljson('uiphid',{});
function hidAdd(id){const o=hidAll();o[S.id+'|'+id]=1;const k=Object.keys(o).slice(-300),p={};k.forEach(x=>p[x]=1);lset('uiphid',JSON.stringify(p))}

/* ================= scadenza / blocchi ================= */
const dlMs=()=>{const d=S&&S.cfg.deadline,t=d?parseDl(d):NaN;return isNaN(t)?null:t};
let curPh='none';
function cdInfo(){const t=dlMs(),d=S&&S.cfg.deadline;if(t===null)return{ph:'none',html:d?ic('clock')+' Scadenza: '+esc(d):''};
 const left=t-Date.now(),when=new Date(t).toLocaleString('it-IT',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 if(left<=0)return{ph:'closed',html:ic('clock')+' Tempo scaduto: puntate chiuse<span>Scadenza: '+esc(when)+'</span>'};
 const last=left<=3600000;return{ph:last?'last':'open',html:(last?ic('alert')+' Ultima ora per puntare!':ic('clock')+' Mancano')+'<b>'+fmt(left)+'</b><span>Scadenza: '+esc(when)+'</span>'}}
const cdBox=()=>{const i=cdInfo();curPh=i.ph;return i.html?`<div class="cd ${i.ph}" id="cd">${i.html}</div>`:''};
/* 't' = tempo scaduto · 'a' = turno chiuso dall'admin · 'n' = nessun turno aperto */
const finOf=d=>!!(d&&(d.fin===1||(d.rn===0&&d.rc>0&&Array.isArray(d.alive)&&d.alive.length<=1)));
const isFin=()=>!!(S&&stD&&stFor===S.id&&finOf(stD));
function lockKind(){if(isFin())return 'f';if(cdInfo().ph==='closed')return 't';if(ready()&&rsFor===S.id&&rsClosed)return 'a';if(stD&&stFor===S.id&&stD.rn===0)return 'n';return ''}
const lockText=k=>k==='f'?'🏁 Partita conclusa: non si può più puntare.':k==='t'?'⏰ Tempo scaduto: non puoi più cambiare squadra.':k==='n'?'⏳ Nessun turno aperto: aspetta che l’organizzatore inizi il prossimo.':'🔒 Turno chiuso: non puoi più cambiare squadra. Aspetta il prossimo turno.';
const isOut=()=>{const n=me().trim().toLowerCase();return !!n&&!!stD&&stFor===S.id&&Array.isArray(stD.out)&&stD.out.some(x=>String(x).trim().toLowerCase()===n)};
const outWhy=()=>{const n=me().trim().toLowerCase();if(!stD||!Array.isArray(stD.out))return '';const i=stD.out.findIndex(x=>String(x).trim().toLowerCase()===n);return i>=0&&stD.why&&stD.why[i]?String(stD.why[i]):''};

  +(lg?'':`<div class="fld">${ic('mail')}<input id="re" type="email" inputmode="email" name="hl-mail" autocomplete="off" data-lpignore="true" data-1p-ignore autocapitalize="off" spellcheck="false" maxlength="80" placeholder="${rc?'Email usata in registrazione':'Email (ti serve se dimentichi la password)'}" value="${esc(regEmail)}"></div>`)

 return `<div class="card big"><h2>${hi(ico,(add?'Nuovo profilo — ':'')+ttl)}</h2>${intro}${f}<button class="sel" data-a="${rc?'rrec':lg?'rlog':'reg'}">${ic(rc?'key':lg?'log-in':'user-plus')}${rc?'Cambia password ed entra':lg?'Entra':'Crea account'}</button>${regMsg?`<div class="nb${/^(✅|Controllo)/.test(regMsg)?'':' w'}">${esc(regMsg)}</div>`:''}`
  +(lg?`<button class="fgt" data-a="rforgot">${ic('key')}Password dimenticata?</button><button class="link" data-a="rmode">${ic('user-plus')}Prima volta? Crea un nuovo account</button>`:rc?`<button class="link" data-a="rmode">${ic('arrow-left')}Torna all’accesso</button>`:`<button class="link" data-a="rmode">${ic('phone')}Ho già un account (anche su un altro dispositivo)</button>`)

 return r.w?`<div class="card gc ok"><b>${hi('circle-check','Tappa 2 · Iscrizione inviata')}</b><span class="mu">Il ${new Date(r.w).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}. Ora aspetta il codice dell’admin.</span><button class="link" data-a="want">${ic('refresh')}Reinvia l’iscrizione</button>${wantMsg?`<p class="mu">${esc(wantMsg)}</p>`:''}</div>`
 :`<div class="card gc"><b>${hi('clipboard','Tappa 2 · Vuoi giocare?')}</b><span class="mu">L’admin vedrà il tuo nome tra i giocatori.</span><button class="sel" data-a="want">${ic('send')}Invia la mia iscrizione</button>${wantMsg?`<p class="mu">${esc(wantMsg)}</p>`:''}</div>`};
function gateScreen(){const r=idGet();
 const off=G&&S&&!ready()?`<div class="card gc" style="border-color:var(--bad)"><b>${hi('alert','Questo codice non ha il collegamento online.','w')}</b><span class="mu">Chiedi all’organizzatore di rimandarti il codice aggiornato e inseriscilo qui sotto.</span></div>`:'';
 return `<div class="gx">`+(codeStale()?`<div class="nb w" role="alert">${ic('key')} <b>Il codice partita è cambiato.</b> Inserisci il nuovo codice che ti ha mandato l’organizzatore.</div>`:'')+(okmsg?`<div class="nb" style="margin:6px 0"><b>${esc(okmsg)}</b></div>`:'')+
 gProf()+pathCard()+wantCard()+off+
 `<div class="card gc"><b>${hi('key','Tappa 3 · Codice partita')}</b><span class="mu">Te lo manda l’admin (6 caratteri, es. K7P4QX).</span><div class="gr"><input id="jcd" autocapitalize="characters" autocomplete="off" placeholder="Codice partita" value="${esc(jcdDraft)}"><button class="sel" data-a="joinc">${ic('log-in')}Entra</button></div>${jmsg?`<p class="mu">${esc(jmsg)}</p>`:''}</div>`+
 rulesBox()+
 `<div class="gl">${closedReg()?'':`<button class="link" data-a="padd">${ic('user-plus')}Altro profilo</button>`}<button class="link" data-a="prm">${ic('log-out')}Rimuovi profilo</button></div></div>`}

function betScreen(){
 const can=isBound(),u=urec(),us=allUsed(u),usN=new Set(us.map(normT)),srvN=new Set(srvUsed().map(normT)),pt=u.pend&&u.pend.t,elim=isOut(),lk=lockKind(),T=teams(),nm=me();
 if(usN.has(normT(draft.team))||elim||!can)draft.team='';
 const ok=!!(can&&draft.team&&!lk&&!elim);

  const kg=rnd(),y=await fetch(u,{method:'PUT',body:JSON.stringify(Object.assign({n:n,k:k,kg:kg,ts:{'.sv':'timestamp'}},em?{e:(await sha('hl|em|'+em.toLowerCase())).slice(0,32)}:{}))});return y.ok?{c:0,n:n,w:0,kg:kg}:{c:5}}catch(e){return{c:3}}}

 if(a==='joinc'){const el=document.getElementById('jcd'),v=(el&&el.value)||'',sc=shortCode(v);let ok=false,done='';

   if(!ok&&!done)jmsg='Codice non trovato: controlla le lettere o chiedi all’organizzatore'}

  if(done)jmsg=done==='old'?'🔑 Questo codice non è più valido: chiedi all’organizzatore il codice nuovo.':'🏁 Questa partita è già conclusa: il codice non è più valido.';
  if(ok)gotIn();else{dt.ot=true;render()}return}
 if(a==='sp'){const o=idsGet();if(o.list.some(x=>x.rid===b.dataset.rid)&&o.cur!==b.dataset.rid){o.cur=b.dataset.rid;idsPut(o);resetProf();regAdding=false;render();poll()}return}

 if(a==='addcancel'){regAdding=false;regMsg='';regPin='';render();return}

  if(confirm(q)){rmProfile(r.rid);resetProf();regAdding=a==='idreset';regMode='login';regMsg='';regPin='';regDraft='';render();if(a==='prm'&&idGet())poll()}return}

{const t=lget('uitheme');if(t)document.documentElement.dataset.theme=t}
