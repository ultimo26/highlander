<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highlander Friends</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#14201a;--mu:#5d6b63;--ac:#1b8a4b;--on:#fff;--bd:#dfe5e0;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0f1512;--card:#18211c;--tx:#e8f0ea;--mu:#93a39a;--ac:#3dd17a;--on:#07210f;--bd:#2a362f;--bad:#ff7a6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#18211c;--tx:#e8f0ea;--mu:#93a39a;--ac:#3dd17a;--on:#07210f;--bd:#2a362f;--bad:#ff7a6b}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;max-width:560px;padding:12px}
h1{font-size:22px;margin:8px 0}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.mu{color:var(--mu);font-size:14px}
textarea{min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips button{width:auto;flex:1 1 40%;margin:0}
.pin{-webkit-text-security:disc;text-security:disc}
button,input,textarea{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:11px;width:100%;margin:4px 0}
button{cursor:pointer;text-align:center}
button:disabled{opacity:.5;cursor:default}
.sel{background:var(--ac);color:var(--on);border-color:var(--ac)}
.link{background:none;border:0;color:var(--mu);font-size:14px;text-decoration:underline;padding:8px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.teams button{margin:0;padding:12px 6px;border-left:6px solid var(--c,var(--bd))}
.teams button.lock{opacity:.55}.teams button.used{text-decoration:line-through;opacity:.5}
.step{font-weight:700;margin:16px 0 6px}
.sendbar{position:sticky;bottom:0;background:var(--card);padding:8px 0 env(safe-area-inset-bottom,0px);margin-top:10px}
.sendbar p{margin:4px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.inl{width:auto;display:inline-block;padding:2px 8px;margin:0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
#thm{width:44px;height:44px;padding:0;margin:0;border-radius:50%;font-size:22px;line-height:1;flex:none}
.cd{text-align:center;border-radius:12px;padding:10px;margin:8px 0;border:1px solid var(--bd);background:var(--bg)}
.cd b{font-size:26px;display:block;font-variant-numeric:tabular-nums}.cd span{font-size:13px;color:var(--mu)}
.cd.last,.cd.closed{border-color:var(--bad);color:var(--bad)}
.ok{border-color:var(--ac)}.no{border:2px solid var(--bad);text-align:center}
.mg.p{border-color:var(--bd)}
.mg{border:1px solid var(--ac);border-radius:10px;padding:8px;margin:6px 0}
summary{cursor:pointer;padding:4px 0}details.card[open] summary{margin-bottom:8px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1e8e4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Highlander">
<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</head>
<body>
<div class="hd"><h1>⚽ Highlander Friends</h1><button id="thm" type="button" aria-label="Cambia tema"></button></div>
<div id="app"></div>
<script>
/* ================= costanti ================= */
const DEF=['Atalanta','Bologna','Cagliari','Como','Fiorentina','Frosinone','Genoa','Inter','Juventus','Lazio','Lecce','Milan','Monza','Napoli','Parma','Roma','Sassuolo','Torino','Udinese','Venezia'];
const TC={Atalanta:'#1c5fa8',Bologna:'#a6192e',Cagliari:'#b3202a',Como:'#0b4ea2',Fiorentina:'#5b2a86',Frosinone:'#f2c200',Genoa:'#b3122b',Inter:'#0a3d91',Juventus:'#222',Lazio:'#7ec8e3',Lecce:'#e2001a',Milan:'#d11a2a',Monza:'#d4202b',Napoli:'#3aa0e0',Parma:'#f6c90e',Roma:'#a8281f',Sassuolo:'#00a651',Torino:'#8b1a1a',Udinese:'#555',Venezia:'#0e6b50'};
const FB_DEFAULT='https://highlander-2026-default-rtdb.europe-west1.firebasedatabase.app';
const FBRE=/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)?\.(firebasedatabase\.app|firebaseio\.com)\/?$/i;
const DEFRULES="HIGHLANDER FRIENDS\n1.\tQuota d’iscrizione 10€ a partecipante scegliendo una squadra di serie A vincente, sarà possibile scegliere più squadre pagando ulteriori 10€\n2.\tLa squadra scelta non potrà essere riscelta nelle giornate successive\n3.\tIn caso di pareggio o sconfitta il partecipante sarà eliminato\n4.\tLa puntata sarà inviata su whatsapp all’admin entro il limite consentito\n5.\tChi non invierà la puntata entro il limite non parteciperà all’intera partita finché non sarà conclusa\n6.\tLa partita si concluderà quando rimarrà un solo partecipante \n7.\tSe in una partita verranno eliminati tutti il montepremi si sommerà a quello della partita dopo\n8.\tIn caso di rinvio o partita sospesa che non si recuperi entro la giornata successiva, il turno dovrà ripetersi\n9.\tEventuali comunicazioni vanno scritte in privato all’admin\n10.\tSe il campionato finisce e la partita non è stata conclusa il montepremi sarà diviso tra i restanti in gara.\n11.\tIl montepremi finale sarà la somma di tutte le iscrizioni meno 1€ a partecipante che andrà all’admin es. 30 iscritti 300€ montepremi finale 270€";

/* ================= utilità ================= */
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cleanN=v=>String(v||'').replace(/[\[\]\n\r]/g,' ').replace(/\s+/g,' ').trim().slice(0,30);
const pidOf=n=>String(n).trim().toLowerCase().replace(/[.$#\[\]\/\s]+/g,'_').slice(0,40)||'_';
const sha=async t=>{try{return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of t)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h}};
const LS=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(e){return false}})();
const lget=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ljson=(k,d)=>{try{return JSON.parse(lget(k))||d}catch(e){return d}};
function parseDl(d){if(!d)return NaN;if(/[zZ]|[+-]\d\d:?\d\d$/.test(d))return Date.parse(d);const m=String(d).match(/^(\d{4})-(\d\d)-(\d\d)[T ](\d\d):(\d\d)/);if(!m)return Date.parse(d);const u=Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5]);let t=u;try{for(let i=0;i<2;i++){const q=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(new Date(t)).reduce((a,x)=>(a[x.type]=+x.value,a),{});t=u-(Date.UTC(q.year,q.month-1,q.day,q.hour,q.minute)-t)}}catch(e){return Date.parse(d)}return t}
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),z=n=>String(n).padStart(2,'0');return (d?d+'g ':'')+z(h)+':'+z(m)+':'+z(s%60)};
function toast(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.setAttribute('role','alert');e.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:88%;background:#7c2d12;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.3);text-align:center';document.body.appendChild(e)}e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.display='none'},3800)}

/* ================= codice partita (formato dell'admin) ================= */
function dec(t){try{let b=String(t).replace(/-/g,'+').replace(/_/g,'/');b+='='.repeat((4-b.length%4)%4);const o=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))));
 const mk=(n,d,t,id)=>({name:String(n||'Partita'),id:id?String(id).replace(/[^A-Za-z0-9_-]/g,'').slice(0,40)||undefined:undefined,cfg:{deadline:d||'',teams:Array.isArray(t)&&t.length>1?t:null}});
 if(Array.isArray(o))return o.length?{games:o.map(x=>mk(x.n,x.d,x.t)),fb:'',rules:''}:null;
 if(o&&Array.isArray(o.g)&&o.g.length)return{games:o.g.map(x=>mk(x[0],x[1],x[2]?(o.t||[])[x[2]-1]:null,x[3])),fb:typeof o.f==='string'&&FBRE.test(o.f)?o.f.slice(0,200):'',rules:typeof o.r==='string'?o.r.slice(0,1500):''};
 return null}catch(e){return null}}
const codeOf=s=>{const m=String(s).match(/#jg([A-Za-z0-9_-]+)/)||String(s).match(/(?:^|\s)jg([A-Za-z0-9_-]{8,})(?=\s|$)/);return m?m[1]:null};
const shortCode=v=>{const m=String(v||'').trim().toUpperCase().replace(/[\s-]/g,'');return /^[ABCDEFGHJKMNPQRSTUVWXYZ2-9]{6}$/.test(m)?m:''};

/* ================= stato ================= */
let G=null,S=null;                       // G = dati partita salvati, S = partita corrente
let stD=null,stFor='',rsClosed=false,rsFor='',bc=[];
let msgs=[],msgFor='',msgText='',msgBusy=false,msgNote='',regAdding=false;
let regMode='new',regDraft='',regPin='',regMsg='',jmsg='',okmsg='',fbmsg='',sending=false,binding=false,bindMsg='',bindCode=null,regSt='',draft={team:''};
const save=()=>{if(G)lset('uipj',JSON.stringify(G))};
function norm(){
 if(!G||!Array.isArray(G.games)||!G.games.length){G=null;S=null;return}
 G.cur=Math.min(Math.max(0,G.cur|0),G.games.length-1);
 if(G.games.length>1){G.games=[G.games[G.cur]];G.cur=0}
 G.fb=typeof G.fb==='string'?G.fb:'';G.rules=typeof G.rules==='string'?G.rules:'';
 S=G.games[0];S.name=S.name||'Partita';S.cfg=Object.assign({deadline:'',teams:null},S.cfg||{})}
try{const q=lget('uipj');if(q)G=JSON.parse(q)}catch(e){}
norm();
const fbBase=()=>G?String(G.fb||'').trim().replace(/\/+$/,''):'';
const ready=()=>!!(S&&S.id&&fbBase());
const teams=()=>S&&S.cfg.teams&&S.cfg.teams.length>1?S.cfg.teams:DEF;
const canon=t=>teams().find(x=>x.toLowerCase()===String(t).trim().toLowerCase());

/* identità del giocatore (nome + PIN), uguale su ogni dispositivo */
/* Profili: su ogni dispositivo si possono avere più nomi (es. giocatore1, giocatore2…), ognuno con il proprio PIN */
const IDK='uipid',IDS='uipids';let idsMem=null;
function idsGet(){let o=null;try{o=JSON.parse(lget(IDS))}catch(e){}if(!o||!Array.isArray(o.list))o=idsMem&&Array.isArray(idsMem.list)?idsMem:{cur:'',list:[]};return o}
function idsPut(o){idsMem=o;lset(IDS,JSON.stringify(o))}
function idGet(){const o=idsGet(),r=o.list.find(x=>x&&x.rid===o.cur)||o.list.find(x=>x&&x.n&&x.rid);return r&&r.n&&r.rid?r:null}
function idPut(r){const o=idsGet(),i=o.list.findIndex(x=>x.rid===r.rid);if(i>=0)o.list[i]=r;else o.list.push(r);o.cur=r.rid;idsPut(o)}
function idMark(f,rid){const o=idsGet(),i=o.list.findIndex(x=>x.rid===(rid||(idGet()||{}).rid));if(i<0)return;f(o.list[i]);idsPut(o)}
function rmProfile(rid){const o=idsGet();o.list=o.list.filter(x=>x.rid!==rid);o.cur=o.list[0]?o.list[0].rid:'';idsPut(o)}
/* migrazione dalle versioni precedenti (un solo profilo) */
(function(){if(idsGet().list.length)return;
 try{const r=JSON.parse(lget(IDK));if(r&&r.n&&r.rid){idPut(r);localStorage.removeItem(IDK);return}}catch(e){}
 try{const o=JSON.parse(lget('uipreg'))||{},k=Object.keys(o).find(x=>o[x]&&o[x].n&&o[x].rid);if(!k)return;const s={};Object.keys(o).forEach(x=>{if(o[x]&&o[x].rid===o[k].rid&&o[x].sent)s[x]=1});idPut({n:o[k].n,rid:o[k].rid,s,gn:{}});localStorage.removeItem('uipreg')}catch(e){}})();
const regRec=()=>{const r=idGet();if(!r)return null;const g=S&&S.id&&r.gn&&r.gn[S.id];return Object.assign({},r,{n:g||r.n})};
const me=()=>{const r=regRec();return r?r.n:''};
const isBound=()=>{const r=idGet();return !!(r&&S&&S.id&&r.s&&r.s[S.id])};

/* chiave segreta per partita (derivata dal PIN, quindi identica su ogni dispositivo) */
const derK=async(n,pin)=>(await sha('hl|'+S.id+'|'+pidOf(n)+'|'+pin)).slice(0,32);
function setPkey(nm,k){const o=ljson('uipk',{});o[S.id+'|'+pidOf(nm)]=k;lset('uipk',JSON.stringify(o))}
function pkey(nm){const o=ljson('uipk',{}),id=S.id+'|'+pidOf(nm);if(!o[id]){const a=new Uint8Array(16);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<16;i++)a[i]=Math.random()*256}o[id]=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');lset('uipk',JSON.stringify(o))}return o[id]}

/* squadre già usate (memorizzate sul dispositivo) */
const uall=()=>ljson('uipused',{});
const usave=o=>lset('uipused',JSON.stringify(o));
const ukey=()=>S.name.toLowerCase()+'|'+me().toLowerCase();
function urec(){const o=uall(),k=ukey(),r=o[k]||{used:[],pend:null};
 if(r.pend){const d=r.pend.dl?parseDl(r.pend.dl):NaN,cl=ready()&&rsFor===S.id&&rsClosed,pn=r.pend.rn|0,
  nx=!!(pn&&stD&&stFor===S.id&&(stD.rn>pn||(stD.rn===0&&stD.rc>=pn)));
  if((!isNaN(d)&&d<=Date.now())||cl||nx){if(!r.used.includes(r.pend.t))r.used.push(r.pend.t);r.pend=null;o[k]=r;usave(o)}}
 return r}
function recordSend(t){const o=uall(),k=ukey(),r=urec();r.pend={t,dl:S.cfg.deadline||'',ts:Date.now(),rn:stD&&stFor===S.id?(stD.rn|0):0};o[k]=r;usave(o)}

/* avvisi dell'admin nascosti dal giocatore */
const hidAll=()=>ljson('uiphid',{});
function hidAdd(id){const o=hidAll();o[S.id+'|'+id]=1;const k=Object.keys(o).slice(-300),p={};k.forEach(x=>p[x]=1);lset('uiphid',JSON.stringify(p))}

/* ================= scadenza / blocchi ================= */
const dlMs=()=>{const d=S&&S.cfg.deadline,t=d?parseDl(d):NaN;return isNaN(t)?null:t};
let curPh='none';
function cdInfo(){const t=dlMs(),d=S&&S.cfg.deadline;if(t===null)return{ph:'none',html:d?'⏰ Scadenza: '+esc(d):''};
 const left=t-Date.now(),when=new Date(t).toLocaleString('it-IT',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 if(left<=0)return{ph:'closed',html:'⏰ Tempo scaduto: puntate chiuse<span>Scadenza: '+esc(when)+'</span>'};
 const last=left<=3600000;return{ph:last?'last':'open',html:(last?'⚠️ Ultima ora per puntare!':'⏰ Mancano')+'<b>'+fmt(left)+'</b><span>Scadenza: '+esc(when)+'</span>'}}
const cdBox=()=>{const i=cdInfo();curPh=i.ph;return i.html?`<div class="cd ${i.ph}" id="cd">${i.html}</div>`:''};
/* 't' = tempo scaduto · 'a' = turno chiuso dall'admin · 'n' = nessun turno aperto */
function lockKind(){if(cdInfo().ph==='closed')return 't';if(ready()&&rsFor===S.id&&rsClosed)return 'a';if(stD&&stFor===S.id&&stD.rn===0)return 'n';return ''}
const lockText=k=>k==='t'?'⏰ Tempo scaduto: non puoi più cambiare squadra.':k==='n'?'⏳ Nessun turno aperto: aspetta che l’organizzatore inizi il prossimo.':'🔒 Turno chiuso: non puoi più cambiare squadra. Aspetta il prossimo turno.';
const isOut=()=>{const n=me().trim().toLowerCase();return !!n&&!!stD&&stFor===S.id&&Array.isArray(stD.out)&&stD.out.some(x=>String(x).trim().toLowerCase()===n)};
const outWhy=()=>{const n=me().trim().toLowerCase();if(!stD||!Array.isArray(stD.out))return '';const i=stD.out.findIndex(x=>String(x).trim().toLowerCase()===n);return i>=0&&stD.why&&stD.why[i]?String(stD.why[i]):''};

/* ================= schermate ================= */
const det=(id,t,c)=>`<details class="card" data-d="${id}" ${dt[id]?'open':''}><summary><b>${t}</b></summary>${c}</details>`;
const dt={};

/* 1 · registrazione */
function regScreen(){const lg=regMode==='login';
 return `<div class="card"><h2>${idGet()?'➕ Nuovo profilo — ':'👤 '}${lg?'Ritrova il tuo nome':'Registrati'}</h2>`+
 (lg?`<p class="mu">Inserisci il nome con cui ti sei registrato e il tuo PIN: ritroverai la stessa identità su questo dispositivo.</p><p class="mu">🔑 <b>Hai dimenticato il PIN?</b> Scrivi all’organizzatore: dopo il reset torna a «Prima registrazione» e registrati con lo stesso nome e un nuovo PIN.</p>`
    :`<p class="mu">Scrivi il tuo nome e scegli un PIN di 4–6 cifre. Il nome resta lo stesso per tutta la partita e lo puoi usare su altri dispositivi con nome e PIN. Non potrai cambiarlo: solo l’admin può modificarlo.</p>`)+
 `<input id="rn" maxlength="30" autocomplete="off" placeholder="Il tuo nome" value="${esc(regDraft)}"><input id="rp" class="pin" type="text" name="hl-pin" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore maxlength="6" placeholder="PIN (4–6 cifre)" value="${esc(regPin)}"><button class="sel" data-a="${lg?'rlog':'reg'}">${lg?'Ritrova il mio nome':'Registrati'}</button><p class="mu">${esc(regMsg)}</p><button class="link" data-a="rmode">${lg?'← Prima registrazione':'Mi sono già registrato su un altro dispositivo'}</button>${idGet()?'<button class="link" data-a="addcancel">← Annulla</button>':''}</div>`}

/* 2 · codice partita */
const codeForm=(btn)=>`<input id="jcd" autocapitalize="characters" autocomplete="off" placeholder="Codice partita (es. K7P4QX)"><button class="sel" data-a="joinc">${btn}</button><p class="mu">${esc(jmsg)}</p>`;
function gateScreen(){const r=idGet();
 const off=G&&S&&!ready()?`<div class="card" style="border-color:var(--bad)"><b>⚠️ Questo codice non ha il collegamento online.</b><p class="mu" style="margin:4px 0 0">Chiedi all’organizzatore di rimandarti il codice aggiornato e inseriscilo qui sotto.</p></div>`:'';
 return (okmsg?`<div class="card ok"><b>${esc(okmsg)}</b></div>`:'')+
 profBar()+off+
 `<div class="card"><h2>🔑 Inserisci il codice partita</h2><p class="mu">Serve il <b>codice partita</b> di 6 caratteri (es. K7P4QX) che ti manda l’organizzatore. Dopo averlo inserito potrai scegliere la squadra.</p>${codeForm('Entra nella partita')}</div>`+
 rulesBox()+exitBox()}

/* barra profili */
function profBar(){const o=idsGet(),cur=idGet();if(!cur)return '';
 const nm=r=>(r.gn&&S&&S.id&&r.gn[S.id])||r.n;
 const out=r=>{const n=nm(r).trim().toLowerCase();return !!stD&&!!S&&stFor===S.id&&Array.isArray(stD.out)&&stD.out.some(x=>String(x).trim().toLowerCase()===n)};
 const multi=o.list.length>1;
 return `<div class="card"><h2>👤 ${multi?'Profili su questo dispositivo':esc(nm(cur))}</h2>`+
  (multi?`<div class="chips">${o.list.map(r=>`<button data-a="sp" data-rid="${esc(r.rid)}" class="${r.rid===cur.rid?'sel':''}" aria-pressed="${r.rid===cur.rid}">${out(r)?'❌ ':''}${esc(nm(r))}</button>`).join('')}</div>`:`<p class="mu" style="margin:0">Nome registrato: solo l’admin può modificarlo.</p>`)+
  `<button class="link" data-a="padd">➕ Aggiungi un altro profilo (altro nome e PIN)</button></div>`}
function resetProf(){regSt='';bindCode=null;bindMsg='';draft.team='';msgs=[];msgFor='';msgText='';msgNote='';fbmsg='';okmsg=''}

/* 3 · puntata */
const rulesBox=()=>det('rg','📜 Regolamento','<div style="white-space:pre-wrap">'+esc(G&&G.rules||DEFRULES)+'</div>');
const exitBox=()=>`<div style="text-align:center"><button class="link" data-a="prm">Rimuovi questo profilo da questo dispositivo</button></div>`;
function bcBox(){const v=bc.filter(m=>!hidAll()[S.id+'|'+m.id]);return v.length?`<div class="card ok"><h2>📣 Avvisi dell’admin</h2>${v.map(m=>`<div class="mg"><span class="mu">${m.ts?new Date(m.ts).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</span><button class="inl" data-a="hm" data-id="${esc(m.id||'')}" aria-label="Nascondi" style="float:right">✕</button><div>${esc(m.t)}</div></div>`).join('')}</div>`:''}
function msgBox(){const r=regRec();if(!r||!isBound())return '';const vis=msgs.filter(m=>!hidAll()[S.id+'|'+m.id]);
 const th=vis.length&&msgFor===S.id?vis.map(m=>`<div class="mg ${m.f==='a'?'':'p'}"><span class="mu">${m.f==='a'?'Admin':'Tu'}${m.ts?' · '+new Date(m.ts).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</span><button class="inl" data-a="hm" data-id="${esc(m.id||'')}" aria-label="Cancella" style="float:right">✕</button><div>${esc(m.t)}</div></div>`).join('')+'<button data-a="hma">🗑 Cancella tutti i messaggi</button>':'<p class="mu">Nessun messaggio.</p>';
 return `<div class="card"><h2>💬 Messaggi con l’admin</h2>${th}<textarea id="mt" maxlength="300" placeholder="Scrivi un messaggio all’admin">${esc(msgText)}</textarea><button class="sel" data-a="msend" ${msgBusy?'disabled':''}>Invia messaggio</button><p class="mu">${esc(msgNote)}</p></div>`}
function rnBox(){if(!stD||stFor!==S.id)return '';
 if(stD.rn>0)return `<div style="font-weight:700;font-size:18px;margin:2px 0 6px">🔢 Turno ${stD.rn}${stD.rs===0?' <span class="mu" style="font-weight:400">(non ancora iniziato)</span>':''}</div>`;
 if(stD.rc>0)return `<div style="margin:2px 0 6px"><b>🔢 Turno ${stD.rc} concluso</b><div class="mu">Aspetta che l’organizzatore apra il prossimo turno.</div></div>`;return ''}
function betScreen(){
 const can=isBound(),u=urec(),us=u.used,elim=isOut(),lk=lockKind(),T=teams(),nm=me();
 if(us.includes(draft.team)||elim||!can)draft.team='';
 const ok=!!(can&&draft.team&&!lk&&!elim);
 const send=ok?`<button class="sel" data-a="fbsend" ${sending?'disabled':''}>📲 Invia la puntata</button><p class="mu">${esc(fbmsg)||'La puntata arriva direttamente all’organizzatore.'}</p>`
  :`<button class="sel" disabled>📲 Invia la puntata</button><p class="mu">${elim?'❌ Sei stato eliminato: non puoi più puntare.':lk?lockText(lk):!can?'⏳ Attendi la conferma del tuo nome.':'Scegli una squadra.'}</p>`;
 const used=us.length||u.pend?det('us','🗂 Le mie squadre già usate ('+us.length+')',(us.map((t,i)=>`<div class="row"><span>${esc(t)}</span><button class="inl" data-a="rmu" data-i="${i}" aria-label="Rimuovi ${esc(t)}">✕</button></div>`).join('')||'<p class="mu">Nessuna per ora.</p>')+(u.pend?`<p class="mu">⏳ In corso: <b>${esc(u.pend.t)}</b> (diventa usata a turno chiuso)</p>`:'')+'<p class="mu">Se una squadra è segnata per errore, tocca ✕.</p>'):'';
 return (okmsg?`<div class="card ok"><b>${esc(okmsg)}</b></div>`:'')+profBar()
 +(elim?`<div class="card no"><div style="font-size:48px;line-height:1">❌</div><h2 style="color:var(--bad);font-size:26px;margin:6px 0">ELIMINATO</h2><p class="mu" style="margin:0">${outWhy()?'Eliminato al '+esc(outWhy())+'.':'La squadra che hai scelto non ha vinto.'}</p></div>`:'')
 +bcBox()
 +(!can?`<div class="card" style="border-color:var(--${bindCode>0?'bad':'ac'})"><b>${bindCode>0?esc(bindMsg):'⏳ Sto inviando il tuo nome all’admin…'}</b>${bindCode>0&&bindCode!==1&&bindCode!==6?'<button class="sel" data-a="rsnd">Riprova</button>':''}${bindCode===1||bindCode===6?'<p class="mu" style="margin:6px 0">Se ricordi il PIN: tocca il pulsante e accedi con nome e PIN.<br>Se lo hai dimenticato: chiedi all’organizzatore di resettare il tuo PIN, poi tocca il pulsante e scegli «Prima registrazione» con un nuovo PIN.</p><button class="sel" data-a="idreset">Rifai l’accesso con nome e PIN</button>':''}</div>`:'')
 +`<div class="card" style="${can?'':'opacity:.6'}"><h2>La tua puntata — ${esc(S.name)}</h2>${rnBox()}${cdBox()}
  <div class="step" style="margin-top:4px">👤 ${esc(nm)}</div>
  ${can&&(regSt==='no'||regSt==='err')?'<p class="mu" style="margin:2px 0;color:var(--bad)">⚠️ Il tuo nome non risulta ancora all’admin.</p><button data-a="rsnd">Reinvia il nome all’admin</button>':''}
  <div class="step">1 · Scegli la squadra</div>
  <div class="teams">${T.map(t=>{const x=us.includes(t);return `<button data-a="pk" data-t="${esc(t)}" style="--c:${TC[t]||'var(--bd)'}" ${x||elim||!can?'disabled':''} class="${t===draft.team?'sel':''}${x?' used':''}${lk&&!x?' lock':''}" aria-pressed="${t===draft.team}">${esc(t)}${x?' (usata)':''}</button>`}).join('')}</div>
  <div class="sendbar"><div class="step" style="margin:0 0 4px">2 · Invia</div>${send}</div>
  ${u.pend?`<div class="cd" style="border-color:var(--ac);color:var(--tx)">✅ Puntata inviata<b>${esc(u.pend.t)}</b><span>Finché il turno è aperto puoi cambiarla</span></div>`:''}</div>`
 +msgBox()+used+rulesBox()
 +det('ot','⚙️ Altro',`<b>Cambia partita</b><p class="mu">Hai un nuovo codice partita? Inseriscilo qui.</p>${codeForm('Usa codice')}`)
 +exitBox()}

function view(){
 if(!idGet()||regAdding)return regScreen();
 if(!ready())return gateScreen();
 return betScreen()}
function render(){
 const a=document.activeElement;if(a&&['INPUT','TEXTAREA'].includes(a.tagName))return;
 $.innerHTML=(LS?'':'<div class="card"><b>⚠️ Dati non salvabili</b><p class="mu">Questo browser non permette di salvare i dati. Apri la pagina con Chrome o Safari (non dall’anteprima di WhatsApp).</p></div>')+view()}

/* ================= rete ================= */
/* Registro globale dei nomi: blocca i doppioni e permette di ritrovare il nome da un altro dispositivo PRIMA di avere il codice partita.
   c: 0 ok · 1 nome preso con altro PIN · 3 offline · 5 registro non disponibile · 6 nome non trovato */
async function gReg(n,pin,create){const base=fbBase()||FB_DEFAULT,rid=pidOf(n),u=base+'/registry/'+encodeURIComponent(rid)+'.json',k=(await sha('hl|*|'+rid+'|'+pin)).slice(0,32);
 try{const x=await fetch(u);if(!x.ok)return{c:5};const d=await x.json();
  if(d&&d.k)return d.k===k?{c:0,n:cleanN(d.n)||n}:{c:1};
  if(!create)return{c:6};
  const y=await fetch(u,{method:'PUT',body:JSON.stringify({n:n,k:k,ts:{'.sv':'timestamp'}})});return y.ok?{c:0,n:n}:{c:5}}catch(e){return{c:3}}}
/* Iscrive il nome nella partita (/players/ID/nome): l'admin lo vede e lo può rinominare */
async function fbReg(n){if(!ready())return 4;const u=fbBase()+'/players/'+S.id+'/'+encodeURIComponent(pidOf(n))+'.json';
 try{const x=await fetch(u);if(x.ok){const d=await x.json();if(d&&d.k&&d.k!==pkey(n))return 1}
  const y=await fetch(u,{method:'PUT',body:JSON.stringify({n:n,k:pkey(n),ts:{'.sv':'timestamp'}})});return y.ok?0:2}catch(e){return 3}}
async function bindGame(force){const r=idGet();if(!r||!ready())return 4;if(!force&&r.s&&r.s[S.id])return 0;if(binding)return -1;
 binding=true;bindMsg='';bindCode=null;const gid=S.id;let c=0;
 try{if(r.pin)setPkey(r.n,await derK(r.n,r.pin));
  if(r.login&&!(r.s&&r.s[gid])){const x=await fetch(fbBase()+'/players/'+gid+'/'+encodeURIComponent(r.rid)+'.json');if(!x.ok)c=3;else{const d=await x.json();if(!d||!d.k)c=6}}
  if(!c)c=await fbReg(r.n)}catch(e){c=3}
 binding=false;if(!S||S.id!==gid)return c;
 if(c===0)idMark(o=>{(o.s=o.s||{})[gid]=1;delete o.login},r.rid);
 if((idGet()||{}).rid!==r.rid){render();return c}
 if(c===0){regSt='ok';bindMsg=''}
 else{regSt='err';bindMsg={1:'❌ Il nome «'+r.n+'» risulta già registrato in questa partita con un altro PIN. Se sei tu, rifai l’accesso con il PIN giusto.',2:'❌ Il database ha rifiutato la registrazione: avvisa l’admin.',3:'❌ Nessuna connessione: riprova.',6:'❌ Nessun giocatore con il nome «'+r.n+'» in questa partita: controlla come l’hai scritto e rifai l’accesso.'}[c]||'❌ Invio del nome non riuscito: riprova.'}
 bindCode=c;render();return c}
/* Controlla che l'admin abbia ancora il nome (e recepisce un'eventuale rinomina) */
async function fbNm(){const r0=idGet();if(!r0||!ready())return;
 if(!(r0.s&&r0.s[S.id])){if(bindCode!==1&&bindCode!==6)await bindGame();return}
 const r=regRec(),gid=S.id;try{const x=await fetch(fbBase()+'/players/'+gid+'/'+encodeURIComponent(r.rid)+'.json');if(!x.ok){setRs('err');return}if((idGet()||{}).rid!==r.rid)return;const d=await x.json(),n=d&&cleanN(d.n);if(d===null){setRs('no');return}setRs('ok');
  if(n&&n!==r.n){const o=uall(),a=S.name.toLowerCase()+'|'+r.n.toLowerCase(),c=S.name.toLowerCase()+'|'+n.toLowerCase();if(o[a]){o[c]=o[a];delete o[a];usave(o)}idMark(q=>{q.gn=q.gn||{};q.gn[gid]=n},r.rid);render()}}catch(e){}}
function setRs(v){if(regSt!==v){regSt=v;render()}}
/* Stato turno (aperto/chiuso) */
async function fbRS(){if(!ready())return;if(rsFor!==S.id){rsFor=S.id;rsClosed=false}
 try{const x=await fetch(fbBase()+'/bets/'+S.id+'/__stato.json');if(!x.ok)return;const d=await x.json(),c=!!(d&&d.t==='chiuso');if(c!==rsClosed){rsClosed=c;if(!c)fbmsg='';render()}}catch(e){}}
/* Stato partita (turno, in gara, eliminati, scadenza, reset) */
function genSync(id,d){try{const g=(d&&d.gen)||0,m=ljson('uipgen',{}),was=m[id]||0;if(g===was)return false;m[id]=g;lset('uipgen',JSON.stringify(m));
 if(!S||S.id!==id)return false;const o=uall(),pre=S.name.toLowerCase()+'|';let ch=false;Object.keys(o).forEach(k=>{if(k.indexOf(pre)===0){delete o[k];ch=true}});if(ch)usave(o);draft.team='';return ch}catch(e){return false}}
async function fbSt(){if(!ready())return;const id=S.id;try{const x=await fetch(fbBase()+'/status/'+id+'.json');if(!x.ok)return;const d=await x.json();let wiped=genSync(id,d);
 if(d&&typeof d.dl==='number'&&S&&S.id===id){const v=d.dl>0?new Date(d.dl).toISOString():'';if((S.cfg.deadline||'')!==v){S.cfg.deadline=v;save();wiped=true}}
 if(wiped||stFor!==id||JSON.stringify(d)!==JSON.stringify(stD)){stD=d;stFor=id;render()}}catch(e){}}
/* Avvisi dell'admin a tutti */
async function fbBc(){if(!ready())return;try{const x=await fetch(fbBase()+'/msgs/'+S.id+'/__tutti.json');if(!x.ok)return;const d=await x.json(),a=d?Object.keys(d).map(k=>Object.assign({id:k},d[k])).filter(m=>m&&m.t).sort((p,q)=>(p.ts||0)-(q.ts||0)).slice(-3):[];if(JSON.stringify(a)!==JSON.stringify(bc)){bc=a;render()}}catch(e){}}
/* Messaggi con l'admin */
async function fbMsgs(){const r=regRec();if(!(r&&ready()))return;const gid=S.id;try{const x=await fetch(fbBase()+'/msgs/'+gid+'/'+encodeURIComponent(r.rid)+'.json');if(!x.ok||(idGet()||{}).rid!==r.rid)return;const d=await x.json(),a=d?Object.keys(d).map(k=>Object.assign({id:k},d[k])).filter(m=>m&&m.t).sort((p,q)=>(p.ts||0)-(q.ts||0)).slice(-15):[];if(msgFor!==gid||JSON.stringify(a)!==JSON.stringify(msgs)){msgs=a;msgFor=gid;render()}}catch(e){}}
async function fbMsgSend(){const r=regRec(),t=String(msgText||'').trim().slice(0,300);if(!r||!t||msgBusy||!ready()||!isBound())return;msgBusy=true;msgNote='';render();
 try{const x=await fetch(fbBase()+'/msgs/'+S.id+'/'+encodeURIComponent(r.rid)+'.json',{method:'POST',body:JSON.stringify({f:'p',n:r.n,t:t,k:pkey(r.n),ts:{'.sv':'timestamp'}})});if(!x.ok)throw 0;msgText='';msgNote='✅ Messaggio inviato';await fbMsgs()}catch(e){msgNote='❌ Invio non riuscito. Riprova più tardi.'}msgBusy=false;render()}
/* Invio puntata */
async function fbSend(){
 const nm=cleanN(me()),tm=draft.team;if(!nm||!tm||sending||!ready()||!isBound())return;
 await fbRS();{const lk=lockKind();if(lk){toast(lockText(lk));return}}
 sending=true;fbmsg='Invio in corso…';render();let st='rete';
 try{
  const x=await fetch(fbBase()+'/bets/'+S.id+'/'+encodeURIComponent(pidOf(nm))+'.json',{method:'PUT',body:JSON.stringify({n:nm,t:tm,k:pkey(nm),ts:{'.sv':'timestamp'}})});
  st=x.status;if(!x.ok){if(x.status===401||x.status===403){fbmsg='❌ Puntata rifiutata: turno chiuso, tempo scaduto o nome già usato da un altro dispositivo.';sending=false;render();return}throw 0}
  fbmsg='✅ Puntata registrata: '+tm+'. Finché il turno è aperto puoi cambiarla.';recordSend(tm);
 }catch(e){fbmsg='❌ Invio non riuscito (codice: '+st+'). Controlla la connessione e riprova.'}
 sending=false;render()}
function poll(){fbSt();fbRS();fbNm();fbBc();fbMsgs()}

/* ================= ingresso in partita ================= */
function joinCode(v){const t=codeOf(v),j=t&&dec(t);if(!j)return false;
 const old=S&&S.id;G={games:j.games,cur:j.games.length-1,fb:j.fb,rules:j.rules};norm();
 if(!S)return false;if(S.id!==old){stD=null;stFor='';bc=[];msgs=[];msgFor='';rsClosed=false;rsFor='';regSt='';bindCode=null;bindMsg=''}
 draft.team='';save();return true}
function gotIn(){okmsg='✅ Ora sei in «'+S.name+'»';jmsg='';render();bindGame().then(poll);poll();setTimeout(()=>{okmsg='';render()},8000)}

/* ================= eventi ================= */
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.d)dt[d.dataset.d]=d.open},true);
document.addEventListener('input',e=>{const i=e.target.id;if(i==='rn')regDraft=e.target.value;if(i==='mt')msgText=e.target.value;if(i==='rp')regPin=e.target.value.replace(/\D/g,'').slice(0,6)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const q={jcd:'[data-a=joinc]',rn:'[data-a=reg],[data-a=rlog]',rp:'[data-a=reg],[data-a=rlog]'}[e.target.id];if(!q)return;const b=document.querySelector(q);if(b){e.preventDefault();b.click()}});
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 const ae=document.activeElement;if(ae&&ae!==b&&ae.blur)ae.blur();
 if(a==='rmode'){regMode=regMode==='login'?'new':'login';regMsg='';render();return}
 if(a==='reg'||a==='rlog'){const lg=a==='rlog',el=document.getElementById('rn'),n=cleanN(el&&el.value),pin=String(regPin||'').trim();regDraft=n;
  if(n.length<2){regMsg=lg?'Scrivi il nome con cui ti eri registrato.':'Scrivi il tuo nome (almeno 2 lettere).';render();return}
  if(!/^\d{4,6}$/.test(pin)){regMsg=lg?'Inserisci il tuo PIN (4–6 cifre).':'Scegli un PIN di 4–6 cifre: ti serve per ritrovare il tuo nome da un altro dispositivo.';render();return}
  regMsg=lg?'Controllo…':'Registrazione in corso…';render();
  const q=await gReg(n,pin,!lg),c=q.c;
  if(c===1){regMsg=lg?'❌ PIN errato. Se l’hai dimenticato, chiedi all’organizzatore di resettarlo.':'❌ Nome già usato da un altro giocatore. Se sei tu su un altro dispositivo, tocca “Mi sono già registrato su un altro dispositivo” e inserisci il tuo PIN; altrimenti aggiungi cognome o iniziale.';render();return}
  if(c===3){regMsg='❌ Nessuna connessione: riprova.';render();return}
  if(c===6){regMsg='❌ Nessun giocatore con questo nome: controlla come l’hai scritto. Se l’organizzatore ha resettato il tuo PIN, tocca “Prima registrazione” e registrati con lo stesso nome e un nuovo PIN.';render();return}
  const nn=q.n||n;
  idPut({n:nn,rid:pidOf(nn),pin,s:{},gn:{},login:(lg&&c===5)?1:undefined});
  resetProf();regAdding=false;regPin='';regMode='new';regMsg='';regSt='';bindMsg='';bindCode=null;lset('uipname',nn);
  okmsg=lg?'✅ Bentornato, '+nn:'✅ Registrato come '+nn;setTimeout(()=>{okmsg='';render()},6000);
  render();if(ready()){bindGame();poll()}return}
 if(a==='joinc'){const el=document.getElementById('jcd'),v=(el&&el.value)||'',sc=shortCode(v);let ok=false;
  if(sc){jmsg='Cerco la partita…';render();try{const x=await fetch(FB_DEFAULT+'/codes/'+sc+'.json');const d=x.ok?await x.json():null;ok=typeof d==='string'&&joinCode(d)}catch(err){}
   if(!ok)jmsg='Codice non trovato: controlla le lettere o chiedi all’organizzatore'}
  else{ok=joinCode(v);if(!ok)jmsg='Codice non valido: controlla le lettere (6 caratteri)'}
  if(ok)gotIn();else{dt.ot=true;render()}return}
 if(a==='sp'){const o=idsGet();if(o.list.some(x=>x.rid===b.dataset.rid)&&o.cur!==b.dataset.rid){o.cur=b.dataset.rid;idsPut(o);resetProf();regAdding=false;render();poll()}return}
 if(a==='padd'){regAdding=true;regMode='new';regMsg='';regDraft='';regPin='';render();return}
 if(a==='addcancel'){regAdding=false;regMsg='';regPin='';render();return}
 if(a==='idreset'||a==='prm'){const r=idGet();if(!r)return;
  const q=a==='prm'?'Rimuovere il profilo «'+r.n+'» da questo dispositivo? Per riaverlo ti serviranno nome e PIN.':'Vuoi cancellare il profilo «'+r.n+'» da questo dispositivo e rifare l’accesso con nome e PIN?';
  if(confirm(q)){rmProfile(r.rid);resetProf();regAdding=a==='idreset';regMode='login';regMsg='';regPin='';regDraft='';render();if(a==='prm'&&idGet())poll()}return}
 if(a==='rsnd'){await bindGame(true);if(bindCode>0)toast(bindMsg);render();return}
 if(a==='pk'){if(!isBound()){toast('⏳ Attendi la conferma del tuo nome');return}const lk=lockKind();if(lk){toast(lockText(lk));return}draft.team=draft.team===b.dataset.t?'':b.dataset.t;fbmsg='';render();return}
 if(a==='fbsend'){fbSend();return}
 if(a==='rmu'){const o=uall(),k=ukey(),r=urec();r.used.splice(+b.dataset.i,1);o[k]=r;usave(o);render();return}
 if(a==='hm'){hidAdd(b.dataset.id);render();return}
 if(a==='hma'){if(confirm('Cancellare tutti i messaggi da questo dispositivo? L’admin continua a vederli.')){msgs.forEach(m=>hidAdd(m.id));render()}return}
 if(a==='msend'){fbMsgSend();return}
});
addEventListener('hashchange',()=>{if(location.hash.indexOf('#jg')===0&&joinCode(location.hash)&&idGet())gotIn()});

/* ================= tema ================= */
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function paintTheme(){const b=document.getElementById('thm');b.textContent=isDark()?'☀️':'🌙';b.title=isDark()?'Passa al tema chiaro':'Passa al tema scuro'}
{const t=lget('uitheme');if(t)document.documentElement.dataset.theme=t}
document.getElementById('thm').addEventListener('click',()=>{const d=!isDark();document.documentElement.dataset.theme=d?'dark':'light';lset('uitheme',d?'dark':'light');paintTheme()});
paintTheme();

/* ================= avvio ================= */
if(location.hash.indexOf('#jg')===0&&joinCode(location.hash)){render();if(idGet())gotIn()}
render();
setInterval(()=>{if(ready()){const i=cdInfo();if(i.ph!==curPh){render();return}const el=document.getElementById('cd');if(el&&i.html)el.innerHTML=i.html}},1000);
setInterval(poll,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});setTimeout(poll,500);
</script>
