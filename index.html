<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highlander Friends</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#14201a;--mu:#5d6b63;--ac:#1b8a4b;--bd:#dfe5e0;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0f1512;--card:#18211c;--tx:#e8f0ea;--mu:#93a39a;--ac:#3dd17a;--bd:#2a362f;--bad:#ff7a6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#18211c;--tx:#e8f0ea;--mu:#93a39a;--ac:#3dd17a;--bd:#2a362f;--bad:#ff7a6b}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;max-width:560px;padding:12px}
h1{font-size:22px;margin:8px 0}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.mu{color:var(--mu);font-size:14px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,input,select,textarea,a.btn{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:11px;width:100%;margin:4px 0}
button,a.btn{cursor:pointer;text-align:center;text-decoration:none;display:block}
.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
a.btn.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
:root[data-theme="dark"] .sel{color:#07210f}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sel{color:#07210f}}
.teams button{margin:0;padding:12px 6px}.teams button.lock{opacity:.55}
.teams button.used{text-decoration:line-through;opacity:.5}button:disabled{opacity:.5;cursor:default}.step{font-weight:700;margin:16px 0 6px}.sendbar{position:sticky;bottom:0;background:var(--card);padding:8px 0 env(safe-area-inset-bottom,0px);margin-top:10px}.sendbar p{margin:4px 0 0}details.sub summary{color:var(--mu);font-size:14px;margin-top:6px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{margin:0}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.row select{width:55%;margin:0;padding:6px}
.row:last-child{border:0}.inl{width:auto;display:inline-block;padding:2px 8px;margin:0}
textarea{min-height:70px}.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}#thm,#snd{width:44px;height:44px;padding:0;margin:0;border-radius:50%;font-size:22px;line-height:1;flex:none}.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}.cd{text-align:center;border-radius:12px;padding:10px;margin:8px 0;border:1px solid var(--bd);background:var(--bg)}.cd b{font-size:26px;display:block;font-variant-numeric:tabular-nums}.cd span{font-size:13px;color:var(--mu)}.cd.last{border-color:var(--bad);color:var(--bad);animation:pl 1.2s infinite}.cd.closed{border-color:var(--bad);color:var(--bad)}@keyframes pl{50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.cd.last{animation:none}}.pod{text-align:center;border:2px solid #d4a017;background:linear-gradient(180deg,rgba(212,160,23,.18),transparent)}.pod .cup{font-size:72px;line-height:1;animation:bn 1.6s ease-in-out infinite}.pod h2{font-size:22px;margin:6px 0 2px}.pod .nm{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:700;padding:8px;margin:6px 0;border-radius:12px;background:var(--card);border:1px solid var(--bd)}.pod .nm i{font-style:normal;font-size:30px}@keyframes bn{50%{transform:translateY(-6px) rotate(-4deg)}}@media(prefers-reduced-motion:reduce){.pod .cup{animation:none}}summary{cursor:pointer;padding:4px 0}details.card[open] summary{margin-bottom:8px}
.gb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.gb button{width:auto;flex:1 1 40%;margin:0}
</style>
</head>
<body>
<div class="hd"><h1>⚽ Highlander Friends<small style="display:block;font-size:11px;font-weight:400;opacity:.65">versione con puntate online</small></h1><div style="display:flex;gap:6px"><button id="snd" type="button" aria-label="Audio"></button><button id="thm" type="button" aria-label="Cambia tema"></button></div></div>
<div id="app"></div>
<script>
const DEF=['Atalanta','Bologna','Cagliari','Como','Fiorentina','Frosinone','Genoa','Inter','Juventus','Lazio','Lecce','Milan','Monza','Napoli','Parma','Roma','Sassuolo','Torino','Udinese','Venezia'];
let SA=DEF.slice();
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let okmsg='',jmsg='',cmsg='',bk='',lv='all',fails=0,lockUntil=+(()=>{try{return localStorage.getItem('uiplk')}catch(e){return 0}})()||0,lastAct=Date.now();const PLAYER_ONLY=true;
let dt={};let S={players:[],rounds:[]},G=null,joined=PLAYER_ONLY,tab='p',armed=null,unlocked=false,lmsg='',msg='',draft={name:'',team:''};
function gt(g){return g.cfg&&g.cfg.teams&&g.cfg.teams.length>1?g.cfg.teams:DEF}
function dec(t){try{let b=String(t).replace(/-/g,'+').replace(/_/g,'/');b+='='.repeat((4-b.length%4)%4);const o=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))));const mk=(n,d,t,id)=>({name:String(n||'Partita'),id:id?String(id).replace(/[^A-Za-z0-9_-]/g,'').slice(0,40)||undefined:undefined,players:[],rounds:[],cfg:{draw:'out',deadline:d||'',teams:Array.isArray(t)&&t.length>1?t:null,maxRounds:0}});
 if(Array.isArray(o))return o.length?o.map(x=>mk(x.n,x.d,x.t)):null;
 if(o&&Array.isArray(o.g)&&o.g.length){const r=o.g.map(x=>mk(x[0],x[1],x[2]?(o.t||[])[x[2]-1]:null,x[3]));r.fb=typeof o.f==='string'&&/^https:\/\//i.test(o.f)?o.f.slice(0,200):'';r.rules=typeof o.r==='string'?o.r.slice(0,1500):'';return r}return null}catch(e){return null}}
function pj(){const h=location.hash;return h.indexOf('#jg')===0?dec(h.slice(3)):null}
function codeOf(s){const m=String(s).match(/#jg([A-Za-z0-9_-]+)/)||String(s).match(/(?:^|\s)jg([A-Za-z0-9_-]{8,})(?=\s|$)/);return m?m[1]:null}
try{const j=pj();if(j){G={games:j,cur:0,rules:j.rules||'',fb:j.fb||''};joined=true}else{const x=localStorage.getItem('uipg'),o=localStorage.getItem('uip'),q=localStorage.getItem('uipj');if(x&&!PLAYER_ONLY)G=JSON.parse(x);else if(o&&!PLAYER_ONLY)G={games:[JSON.parse(o)],cur:0};else if(q){G=JSON.parse(q);joined=true}}}catch(e){}
try{draft.name=localStorage.getItem('uipname')||'';draft.gname=localStorage.getItem('uipgn')||''}catch(e){}
const LS=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(e){return false}})();
if(!G||!Array.isArray(G.games)||!G.games.length)G={games:[{players:[],rounds:[]}],cur:0};
G.cur=Math.min(Math.max(0,G.cur|0),G.games.length-1);G.rules=typeof G.rules==='string'?G.rules:'';

const gidOf=g=>g.id||'';
const fbBase=()=>String(G.fb||'').trim().replace(/\/+$/,'');
const pidOf=n=>String(n).trim().toLowerCase().replace(/[.$#\[\]\/\s]+/g,'_').slice(0,40)||'_';
let fbCodeLast={},fbLog=[],fbDirty=false,fbBusy=false,fbmsg='',fbSending=false,rsClosed=false,rsFor='',toastT=0;
const FB_DEFAULT='https://highlander-2026-default-rtdb.europe-west1.firebasedatabase.app';
const JCA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function shortCode(v){const m=String(v||'').trim().toUpperCase().replace(/[\s-]/g,'');return /^[ABCDEFGHJKMNPQRSTUVWXYZ2-9]{6}$/.test(m)?m:''}
function jcOf(g){g=g||S;if(!/^[ABCDEFGHJKMNPQRSTUVWXYZ2-9]{6}$/.test(g.jc||'')){let c;do{const a=new Uint8Array(6);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<6;i++)a[i]=Math.random()*256}c=[...a].map(x=>JCA[x%JCA.length]).join('')}while(G.games.some(x=>x.jc===c));g.jc=c;try{save()}catch(e){}}return g.jc}
function norm(g){g=g||S;g.name=g.name||'Partita 1';g.players=g.players||[];g.rounds=g.rounds||[];g.cfg=Object.assign({draw:'out',deadline:'',teams:null,maxRounds:0},g.cfg||{});if(g===S)SA=gt(S).slice()}
G.games.forEach(g=>norm(g));S=G.games[G.cur];norm();
const save=()=>{try{localStorage.setItem(joined?'uipj':'uipg',JSON.stringify(G))}catch(e){}};
if(joined)save();
const cleanN=v=>String(v||'').replace(/[\[\]\n\r]/g,' ').replace(/\s+/g,' ').trim().slice(0,30);
const gameBy=n=>G.games.find(x=>x.name.toLowerCase()===String(n).trim().toLowerCase());
const findIn=(g,n)=>g.players.find(p=>p.name.toLowerCase()===n.trim().toLowerCase());
const canonG=(g,t)=>gt(g).find(x=>x.toLowerCase()===t.trim().toLowerCase());
function pbase(){try{const v=localStorage.getItem('uipbase');if(v)return v}catch(e){}return location.href.split('#')[0]}
function pcode(only){const T=[],g=(only?[only]:G.games).map(x=>{const t=x.cfg.teams&&x.cfg.teams.length>1?x.cfg.teams:null;let k=0;if(t){const j=JSON.stringify(t);k=T.findIndex(y=>JSON.stringify(y)===j)+1;if(!k){T.push(t);k=T.length}}return [x.name,x.cfg.deadline||'',k,gidOf(x)]});const o={g};if(T.length)o.t=T;if(G.rules)o.r=G.rules;if(fbBase())o.f=fbBase();const by=new TextEncoder().encode(JSON.stringify(o));let b='';by.forEach(c=>b+=String.fromCharCode(c));return 'jg'+btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function plink(){return pbase()+'#'+pcode(S)}
const isLocal=u=>/^(file|content|blob|about|data|filesystem):/i.test(u)||/^(https?:\/\/)?(localhost|127\.|192\.168\.)/i.test(u);
function pmsg(){return pm0()+(fbBase()?'\n\n🔢 Oppure inserisci nella pagina il codice di «'+S.name+'»: '+jcOf(S):'')}
function pm0(){return isLocal(pbase())?'⚽ Highlander Friends\nPer puntare: apri il file Highlander Friends, tocca “Hai un codice invito?” e incolla questo codice:\n\n'+pcode(S):'⚽ Highlander Friends\nApri il link e scegli la partita su cui puntare:\n'+plink()+'\n\nSe il link non si apre: apri la pagina, tocca “Hai un codice invito?” e incolla questo codice:\n'+pcode(S)}
function joinCode(v){const t=codeOf(v),j=t&&dec(t);if(!j)return false;
 const keep=(G&&G.games||[]).filter(g=>g.id);
 if(keep.length){let ci=0;j.forEach(n=>{const i=n.id?keep.findIndex(g=>g.id===n.id):-1;if(i>=0){const e=keep[i];e.name=n.name;e.cfg.deadline=n.cfg.deadline;e.cfg.teams=n.cfg.teams;ci=i}else{keep.push(n);ci=keep.length-1}});G.games=keep;G.cur=ci;G.rules=j.rules||G.rules||'';G.fb=j.fb||G.fb||''}
 else G={games:j,cur:j.length-1,rules:j.rules||'',fb:j.fb||''};
 joined=true;S=G.games[G.cur];norm();draft.team='';alertPh=cdInfo().ph;save();return true}
function useGame(i){if(!G.games[i])return;G.cur=i;S=G.games[i];norm();draft.team='';armed=null;msg='';cmsg='';alertPh=cdInfo().ph;save();render()}
function gbar(){if(G.games.length<2)return '';return `<div class="gb">${G.games.map((g,i)=>{const r=g.rounds.find(x=>x.status==='open'),al=g.players.filter(p=>!p.out),d=Date.parse(g.cfg.deadline),left=d-Date.now();
 const inf=g.players.length?' · '+(tab==='a'&&r?al.filter(p=>r.bets[p.name]).length+'/'+al.length+' puntate':al.length+'/'+g.players.length):'',mk=isNaN(d)?'':left<=0?' 🔒':left<=3600000?' ⚠️':'';
 return `<button data-a="sg" data-i="${i}" aria-pressed="${i===G.cur}" class="${i===G.cur?'sel':''}">${esc(g.name)}${inf}${mk}</button>`}).join('')}</div>`}
const sha=async t=>{try{return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of t)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h}};
const getPw=()=>{try{return localStorage.getItem('uippw')}catch(e){return null}};
const setPw=h=>{try{localStorage.setItem('uippw',h)}catch(e){}};
function lock(){const has=getPw();return `<button class="inl" data-a="gop">← Schermata giocatore</button><div class="card"><h2>${has?'Area admin':'Crea la password admin'}</h2><input id="apw" type="password" placeholder="Password"><button class="sel" data-a="${has?'unlock':'setpw'}">${has?'Entra':'Salva password'}</button><p class="mu">${esc(lmsg)}</p>${has?'':'<p class="mu">Scegli una password e ricordala: ti servirà ogni volta che apri l’area admin.</p>'}</div>`}
const passes=(r,t)=>!!t&&((r.winners||[]).includes(t)||(S.cfg.draw==='pass'&&(r.draws||[]).includes(t)));
const dlMs=()=>{const d=S.cfg.deadline,t=d?Date.parse(d):NaN;return isNaN(t)?null:t};
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),z=n=>String(n).padStart(2,'0');return (d?d+'g ':'')+z(h)+':'+z(m)+':'+z(s%60)};
let curPh='none',alertPh=null;
function cdInfo(){const t=dlMs(),d=S.cfg.deadline;if(t===null)return{ph:'none',html:d?'⏰ Scadenza: '+esc(d):''};
 const left=t-Date.now(),when=new Date(t).toLocaleString('it-IT',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 if(left<=0)return{ph:'closed',html:'⏰ Tempo scaduto: puntate chiuse<span>Scadenza: '+esc(when)+'</span>'};
 const last=left<=3600000;return{ph:last?'last':'open',html:(last?'⚠️ Ultima ora per puntare!':'⏰ Mancano')+'<b>'+fmt(left)+'</b><span>Scadenza: '+esc(when)+'</span>'}}
const cdBox=()=>{const i=cdInfo();curPh=i.ph;return i.html?`<div class="cd ${i.ph}" id="cd">${i.html}</div>`:''};
const open=()=>S.rounds.find(r=>r.status==='open');
const alive=()=>S.players.filter(p=>!p.out);
const maxR=()=>{const m=parseInt(S.cfg.maxRounds);return m>0?m:0};
const doneN=()=>S.rounds.filter(r=>r.status==='done').length;
const noTeams=()=>alive().length>1&&alive().every(p=>SA.every(t=>p.used.includes(t)));
const ended=()=>!open()&&S.rounds.length>0&&(alive().length<=1||(maxR()>0&&doneN()>=maxR())||noTeams());
function podium(){const w=alive().map(p=>p.name);if(!w.length)return `<div class="card" style="text-align:center"><h2>Tutti eliminati</h2><p class="mu">Nessun vincitore.</p></div>`;
 const one=w.length===1;
 return `<div class="card pod"><div class="cup">🏆</div><h2>${one?'Abbiamo un vincitore!':'Abbiamo '+w.length+' vincitori!'}</h2>${w.map(n=>`<div class="nm"><i>${one?'🥇':'🏅'}</i>${esc(n)}</div>`).join('')}<p class="mu">${one?'Ultimo in piedi: ha vinto il premio.':(noTeams()?'Squadre finite: si dividono il premio':'Turni finiti: si dividono il premio')+(w.length>1?' in '+w.length+' parti uguali':'')+'.'}</p></div>`}
const joinN=a=>a.length>1?a.slice(0,-1).join(', ')+' e '+a[a.length-1]:(a[0]||'');
const find=n=>findIn(S,n);
const canon=t=>SA.find(x=>x.toLowerCase()===t.trim().toLowerCase());
const gtag=()=>G.games.length>1?S.name:cleanN(draft.gname);
const text=(n,t)=>`Puntata Highlander Friends${gtag()?' ['+gtag()+']':''}: ${n} -> ${t}`;

function setBet(g,name,team){
  const r=g.rounds.find(x=>x.status==='open'),p=findIn(g,name),t=canonG(g,team);
  if(!r)return 'Nessun turno aperto';
  if(!p)return 'Giocatore sconosciuto: '+name;
  if(p.out)return p.name+' è eliminato';
  if(!t)return 'Squadra non valida: '+team;
  if(p.used.includes(t))return p.name+' ha già usato '+t;
  r.bets[p.name]=t;return '';
}
function statusText(){
  const r=open(),n=S.rounds.length;
  let t=`⚽ Highlander Friends${G.games.length>1?' ['+S.name+']':''} — ${r?r.label:'situazione'}${maxR()?' (di '+maxR()+')':''}\nIn gara: ${alive().length}\n`;
  alive().forEach(p=>t+=`• ${p.name}${p.used.length?' (già usate: '+p.used.join(', ')+')':''}\n`);
  const d=S.players.filter(p=>p.out);if(d.length)t+='\nEliminati: '+d.map(p=>p.name).join(', ');
  if(ended()&&alive().length>1)t+='\n\n🏆 Turni finiti! Vincono '+joinN(alive().map(p=>p.name))+' e si dividono il premio';
  else if(ended()&&alive().length===1)t+='\n\n🏆 Ha vinto '+alive()[0].name+'!';
  return t;
}
const det=(id,t,c)=>`<details class="card" data-d="${id}" ${dt[id]?'open':''}><summary><b>${t}</b></summary>${c}</details>`;
const DEFRULES="HIGHLANDER FRIENDS\n1.\tQuota d’iscrizione 10€ a partecipante scegliendo una squadra di serie A vincente, sarà possibile scegliere più squadre pagando ulteriori 10€\n2.\tLa squadra scelta non potrà essere riscelta nelle giornate successive\n3.\tIn caso di pareggio o sconfitta il partecipante sarà eliminato\n4.\tLa puntata sarà inviata su whatsapp all’admin entro il limite consentito\n5.\tChi non invierà la puntata entro il limite non parteciperà all’intera partita finché non sarà conclusa\n6.\tLa partita si concluderà quando rimarrà un solo partecipante \n7.\tSe in una partita verranno eliminati tutti il montepremi si sommerà a quello della partita dopo\n8.\tIn caso di rinvio o partita sospesa che non si recuperi entro la giornata successiva, il turno dovrà ripetersi\n9.\tEventuali comunicazioni vanno scritte in privato all’admin\n10.\tSe il campionato finisce e la partita non è stata conclusa il montepremi sarà diviso tra i restanti in gara.\n11.\tIl montepremi finale sarà la somma di tutte le iscrizioni meno 1€ a partecipante che andrà all’admin es. 30 iscritti 300€ montepremi finale 270€";
const rulesBox=()=>det('rg','📜 Regolamento','<div style="white-space:pre-wrap">'+esc(G.rules||DEFRULES)+'</div>');
const UK='uipused';
function uall(){try{return JSON.parse(localStorage.getItem(UK))||{}}catch(e){return {}}}
function usave(o){try{localStorage.setItem(UK,JSON.stringify(o))}catch(e){}}
const ukey=()=>S.name.toLowerCase()+'|'+draft.name.trim().toLowerCase();
function urec(){const o=uall(),k=ukey();const r=o[k]||{used:[],pend:null};
 if(r.pend&&r.pend.dl){const d=Date.parse(r.pend.dl);if(!isNaN(d)&&d<=Date.now()){if(!r.used.includes(r.pend.t))r.used.push(r.pend.t);r.pend=null;o[k]=r;usave(o)}}
 return r}
const usedTeams=()=>draft.name.trim()?urec().used:[];
function recordSend(){if(!draft.name.trim()||!draft.team)return;const o=uall(),k=ukey(),r=urec();r.pend={t:draft.team,dl:S.cfg.deadline||'',ts:Date.now()};o[k]=r;usave(o);setTimeout(render,150)}
function gotIn(){okmsg='✅ Ora sei in «'+S.name+'»';jmsg='';setTimeout(()=>{okmsg='';render()},8000)}
function usedBox(){if(!draft.name.trim())return '';const u=urec();if(!u.used.length&&!u.pend)return '';
 return det('us','🗂 Le mie squadre già usate ('+u.used.length+')',(u.pend?`<p class="mu">Ultima puntata: <b>${esc(u.pend.t)}</b>. Finché il turno è aperto puoi ancora cambiarla.</p><button data-a="cfu">Turno finito: segna ${esc(u.pend.t)} come usata</button>`:'')+(u.used.map((t,i)=>`<div class="row"><span>${esc(t)}</span><button class="inl" data-a="rmu" data-i="${i}" aria-label="Rimuovi ${esc(t)}">✕</button></div>`).join('')||'<p class="mu">Nessuna per ora.</p>')+'<p class="mu">Se hai segnato una squadra per errore, tocca ✕.</p>')}
function player(){
  if(dt.cd===undefined&&!G.games.some(g=>g.id))dt.cd=true;
  const us=usedTeams();if(us.includes(draft.team))draft.team='';
  const nm=draft.name.trim(),ok=!!(nm&&draft.team),lk=lockKind(),closed=!!lk,u=nm?urec():null,multi=G.games.length>1;
  const online=!!(fbBase()&&S.id),waHref='https://wa.me/?text='+encodeURIComponent(text(draft.name,draft.team));

odice invito</button><p class="mu">Chi riceve il messaggio apre la pagina (o il file), tocca “Hai un codice invito?” e incolla il codice. Se non funziona, il giocatore può scrivere a mano il nome della partita (es. “${esc(S.name)}”) nel campo sopra la squadra: il messaggio parte con quel nome e lo importi normalmente. Se cambi nomi, squadre o scadenze, rimandalo.</p><p class="mu">${esc(cmsg)}</p>`);

document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.d)dt[d.dataset.d]=d.open},true);

document.addEventListener('input',e=>{if(e.target.id==='dl'&&unlocked){S.cfg.deadline=e.target.value.slice(0,80);save()}if(e.target.id==='mr'&&unlocked){S.cfg.maxRounds=Math.max(0,Math.min(99,parseInt(e.target.value)||0));save()}if(e.target.id==='pbs'&&unlocked){try{localStorage.setItem('uipbase',e.target.value.trim().split('#')[0].slice(0,500))}catch(x){}}if(e.target.id==='gn2'){draft.gname=e.target.value;try{localStorage.setItem('uipgn',draft.gname)}catch(x){}}if(e.target.id==='nm'){draft.name=e.target.value;try{localStorage.setItem('uipname',draft.name)}catch(x){}}});

document.addEventListener('click',async e=>{

  if(b.dataset.a==='joinc'){const el=document.getElementById('jcd'),v=(el&&el.value)||'',sc=shortCode(v);let ok=false;
   if(sc){jmsg='Cerco la partita…';render();try{const x=await fetch((FB_DEFAULT||fbBase())+'/codes/'+sc+'.json');const d=x.ok?await x.json():null;ok=typeof d==='string'&&joinCode(d)}catch(e){}
    if(!ok)jmsg='Codice non trovato: controlla le lettere o chiedi all’organizzatore'}

  if((b.dataset.a==='unlock'||b.dataset.a==='setpw')&&tab!=='a')return;

  else if(b.dataset.a==='cld'){S.cfg.deadline='';save()}
  else if(b.dataset.a==='svfb'){const v=(document.getElementById('fbu').value||'').trim(),m=v.match(/^https:\/\/[^\/\s?#]+/i);if(!v){G.fb='';save();cmsg='Puntate online disattivate'}else if(!m)cmsg='Indirizzo non valido: deve iniziare con https://';else{G.fb=m[0];save();cmsg='Indirizzo salvato ✅ Ora rimanda il codice invito ai giocatori'}}
  else if(b.dataset.a==='tfb'){const base=fbBase();if(!base)cmsg='Prima salva l’indirizzo';else{try{const x=await fetch(base+'/bets/_test/ping.json',{method:'PUT',body:JSON.stringify({n:'t',t:'t',ts:{'.sv':'timestamp'}})});if(!x.ok)throw 0;const y=await fetch(base+'/bets/_test/ping.json'),j=await y.json();await fetch(base+'/bets/_test.json',{method:'PUT',body:'null'});cmsg=j&&j.n?'Connessione OK ✅':'Risposta strana: controlla le regole del database'}catch(e){cmsg='Connessione non riuscita ❌ Controlla indirizzo e regole del database'}}}
  else if(b.dataset.a==='svt'){const l=[...new Set(document.getElementById('tms').value.split(/[\n,]/).map(x=>x.trim()).filter(Boolean))];if(l.length<2)cmsg='Servono almeno 2 squadre';else{S.cfg.teams=l;norm();save();cmsg='Squadre salvate ('+l.length+')'}}
  else if(b.dataset.a==='svr'){const v=document.getElementById('rgt').value.trim().slice(0,1500);G.rules=v===DEFRULES?'':v;save();cmsg='Regolamento salvato'}
  else if(b.dataset.a==='dfr'){G.rules='';save();cmsg='Testo base ripristinato'}
  else if(b.dataset.a==='deft'){S.cfg.teams=null;norm();save();cmsg='Elenco ripristinato'}
  else if(b.dataset.a==='undo'){const l=S.rounds[S.rounds.length-1];if(!l||l.status!=='done'||!l.snap){}else if(armed!=='undo')armed='undo';else{S.players=JSON.parse(l.snap);l.status='open';delete l.snap;delete l.res;armed=null;save()}}
  else if(b.dataset.a==='cpbk'){try{await navigator.clipboard.writeText(JSON.stringify(G));cmsg='Backup copiato ✅'}catch(e){const t=document.getElementById('st2');t.focus();t.select();cmsg='Seleziona il testo e copialo a mano'}}
  else if(b.dataset.a==='rsbk'){if(armed!=='rsbk'){bk=document.getElementById('bki').value;armed='rsbk'}else{try{const o=JSON.parse(bk);if(Array.isArray(o.games)&&o.games.length)G={games:o.games,cur:0,fb:typeof o.fb==='string'?o.fb:'',jc:typeof o.jc==='string'?o.jc:undefined};else if(Array.isArray(o.players)&&Array.isArray(o.rounds)){o.name=S.name;G.games[G.cur]=o}else throw 0;G.games.forEach(g=>norm(g));G.rules=typeof G.rules==='string'?G.rules:'';G.cur=Math.min(G.cur,G.games.length-1);S=G.games[G.cur];norm();save();bk='';cmsg='Backup ripristinato ✅'}catch(e){cmsg='Backup non valido'}armed=null}}
  else if(b.dataset.a==='addp'){document.getElementById('pls').value.split(',').map(x=>x.trim()).filter(x=>x&&!find(x)).forEach(n=>S.players.push({name:n,out:null,used:[]}));save()}
  else if(b.dataset.a==='delp'){const k='d'+b.dataset.i;if(armed!==k){armed=k}else{S.players.splice(+b.dataset.i,1);armed=null;save()}}
  else if(b.dataset.a==='newr'){if(ended())return render();S.rounds.push({label:'Turno '+(S.rounds.length+1),status:'open',bets:{},winners:[]});save()}
  else if(b.dataset.a==='imp'){
    const rep=[];
    document.getElementById('paste').value.split('\n').forEach(l=>{
      const m=l.match(/Puntata (?:Highlander Friends|Ultimo in Piedi)(?:\s*\[(.+?)\])?:\s*(.+?)\s*(?:->|→)\s*(.+?)\s*$/i);if(!m)return;
      const g=m[1]?gameBy(m[1]):S,nm=m[2].trim(),tm=m[3].trim();
      if(!g){rep.push(nm+' → '+tm+' ❌ Partita sconosciuta: '+m[1].trim()+' (esistenti: '+G.games.map(x=>x.name).join(', ')+')');return}
      const tag=g!==S?' ['+g.name+']':(!m[1]&&G.games.length>1?' [in '+g.name+']':'');
      if(!canonG(g,tm)){rep.push(nm+' → '+tm+tag+' ❌ Squadra non valida');return}
      let add='';if(!findIn(g,nm)){g.players.push({name:nm,out:null,used:[]});add=' (nuovo giocatore)'}
      const er=setBet(g,nm,tm),p=findIn(g,nm);
      rep.push(p.name+' → '+canonG(g,tm)+tag+add+(er?' ❌ '+er:' ✅'))});
    msg=rep.length?rep:'Nessuna puntata trovata nel testo incollato.';save()}
  else if(b.dataset.a==='newgm'){const raw=cleanN(document.getElementById('gnn').value)||('Partita '+(G.games.length+1));let nm=raw,k=2;while(gameBy(nm))nm=raw+' '+k++;const cp=document.getElementById('gpl').value;const cpv=cp==='empty'?'':cp;
    const g={name:nm,players:cpv?S.players.filter(p=>cpv==='copy'||!p.out).map(p=>({name:p.name,out:null,used:[]})):[],rounds:[],cfg:{draw:S.cfg.draw,deadline:'',teams:S.cfg.teams?S.cfg.teams.slice():null,maxRounds:S.cfg.maxRounds}};
    G.games.push(g);G.cur=G.games.length-1;S=g;norm();alertPh=cdInfo().ph;msg='';save();cmsg='Creata «'+nm+'»: ora sei in questa partita'}
  else if(b.dataset.a==='rng'){const v=cleanN(document.getElementById('gnr').value),o=v&&gameBy(v);if(!v)cmsg='Nome non valido';else if(o&&o!==S)cmsg='Esiste già una partita con questo nome';else{S.name=v;save();cmsg='Rinominata'}}
  else if(b.dataset.a==='pull'){let n=0;G.games.forEach(g=>{if(g!==S)g.players.forEach(p=>{if(!find(p.name)){S.players.push({name:p.name,out:null,used:[]});n++}})});save();cmsg=n?n+' giocatori aggiunti':'Nessun giocatore nuovo da aggiungere'}
  else if(b.dataset.a==='delg'){if(G.games.length<2){}else if(armed!=='delg')armed='delg';else{G.games.splice(G.cur,1);G.cur=0;S=G.games[0];norm();alertPh=cdInfo().ph;armed=null;save()}}
  else if(b.dataset.a==='shr'){try{if(navigator.share)await navigator.share({text:pmsg()});else cmsg='Condivisione non disponibile: usa “Copia messaggio”'}catch(e){}}
  else if(b.dataset.a==='cpcd'){try{await navigator.clipboard.writeText(pcode(S));cmsg='Codice copiato ✅'}catch(e){cmsg='Copia a mano il testo dal messaggio'}}
  else if(b.dataset.a==='cplk'){try{await navigator.clipboard.writeText(pmsg());cmsg='Messaggio copiato ✅'}catch(e){const t=document.getElementById('plk');t.focus();t.select();cmsg='Seleziona il testo e copialo a mano'}}
  else if(b.dataset.a==='done'){
    if(armed!=='done'){armed='done'}else{
      r.snap=JSON.stringify(S.players);r.res={};alive().forEach(p=>{const t=r.bets[p.name];r.res[p.name]=passes(r,t);if(passes(r,t))p.used.push(t);else p.out=r.label+(t?' ('+t+')':' (nessuna puntata)')});
      r.status='done';armed=null;msg='';save();fbClear(S)}}
  else if(b.dataset.a==='newgame'){if(armed!=='newgame'){armed='newgame'}else{S.players.forEach(p=>{p.out=null;p.used=[]});S.rounds=[];armed=null;msg='';save();fbClear(S)}}
  else if(b.dataset.a==='reset'){if(armed!=='reset'){armed='reset'}else{G.games[G.cur]=S={name:S.name,id:S.id,jc:S.jc,players:[],rounds:[],cfg:S.cfg};fbClear(S);armed=null;save()}}
  render();
});
try{if(sessionStorage.getItem('uipga')){sessionStorage.removeItem('uipga');if(!joined)tab='a'}}catch(e){}
if(location.hash==='#admin'&&!joined&&!PLAYER_ONLY)tab='a';
addEventListener('hashchange',()=>{if(location.hash.indexOf('#jg')===0&&joinCode(location.hash)){gotIn();render();return}if(location.hash==='#admin'&&!joined&&!PLAYER_ONLY){tab='a';armed=null;render()}});
let taps=0,tapT=0;
document.querySelector('h1').addEventListener('click',()=>{const n=Date.now();taps=n-tapT<1500?taps+1:1;tapT=n;if(taps>=5){taps=0;if(joined){if(PLAYER_ONLY)return;let has=false;try{has=!!localStorage.getItem('uipg')}catch(x){}if(has){try{sessionStorage.setItem('uipga','1')}catch(x){}try{history.replaceState(null,'',location.href.split('#')[0])}catch(x){}location.reload()}return}tab='a';armed=null;render()}});
['click','input','change'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},true));
setInterval(()=>{if(unlocked&&Date.now()-lastAct>300000){unlocked=false;tab='p';armed=null;lmsg='';const a=document.activeElement;if(a&&a.blur)a.blur();render()}},15000);
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function paintTheme(){document.getElementById('snd').textContent=muted?'🔇':'🔊';const b=document.getElementById('thm');b.textContent=isDark()?'☀️':'🌙';b.title=isDark()?'Passa al tema chiaro':'Passa al tema scuro'}
let muted=false;try{muted=localStorage.getItem('uimute')==='1'}catch(e){}
let ac=null;
function blip(dark){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const n=ac.currentTime,f=dark?[660,440]:[440,660];
 f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=n+i*0.09;o.type='sine';o.frequency.value=hz;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.08,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.18)})}catch(e){}}
try{const st=localStorage.getItem('uitheme');if(st)document.documentElement.dataset.theme=st}catch(e){}
document.getElementById('thm').addEventListener('click',e=>{e.stopPropagation();const d=!isDark();document.documentElement.dataset.theme=d?'dark':'light';try{localStorage.setItem('uitheme',d?'dark':'light')}catch(x){}paintTheme();blip(d)});
document.getElementById('snd').addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('uimute',muted?'1':'0')}catch(x){}paintTheme();blip(isDark())});
paintTheme();
if(pj())gotIn();render();
alertPh=cdInfo().ph;
setInterval(()=>{const i=cdInfo();
 if((alertPh==='open'&&i.ph==='last')||(alertPh==='last'&&i.ph==='closed')){blip(true);try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
 alertPh=i.ph;
 if(tab==='p'&&i.ph!==curPh){render();return}
 const el=document.getElementById('cd');if(el&&i.html&&i.ph===curPh)el.innerHTML=i.html},1000);

async function fbClear(){}
async function fbState(){}
async function fbSend(){
 const nm=cleanN(draft.name),tm=draft.team;if(!nm||!tm||fbSending||!fbBase()||!S.id)return;
 await fbRS();{const lk=lockKind();if(lk){toast(lockText(lk));return}}
 fbSending=true;fbmsg='Invio in corso…';render();
 try{
  const x=await fetch(fbBase()+'/bets/'+S.id+'/'+encodeURIComponent(pidOf(nm))+'.json',{method:'PUT',body:JSON.stringify({n:nm,t:tm,ts:{'.sv':'timestamp'}})});
  if(!x.ok)throw 0;
  fbmsg='✅ Puntata registrata: '+tm+'. Finché il turno è aperto puoi cambiarla.';recordSend();
 }catch(e){fbmsg='❌ Invio non riuscito. Riprova, oppure usa WhatsApp qui sotto.';dt.cp=true}
 fbSending=false;render();
}

function lockKind(){if(cdInfo().ph==='closed')return 't';return fbBase()&&S.id&&rsFor===S.id&&rsClosed?'a':''}
function lockText(k){return k==='t'?'⏰ Tempo scaduto: non puoi più cambiare squadra.':'🔒 Turno chiuso: non puoi più cambiare squadra. Aspetta il prossimo turno.'}
function toast(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.setAttribute('role','alert');e.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:88%;background:#7c2d12;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.3);text-align:center';document.body.appendChild(e)}e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{e.style.display='none'},3800)}
async function fbRS(){
 if(!(fbBase()&&S.id))return;
 if(rsFor!==S.id){rsFor=S.id;rsClosed=false}
 try{const x=await fetch(fbBase()+'/bets/'+S.id+'/__stato.json');if(!x.ok)return;const d=await x.json(),c=!!(d&&d.t==='chiuso');if(c!==rsClosed){rsClosed=c;render()}}catch(e){}
}
setInterval(fbRS,8000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fbRS()});
setTimeout(fbRS,400);
